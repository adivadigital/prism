<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism — Image Editor</title>
<style>
  :root{
    --bg:#1e1e1e; --panel:#2b2b2b; --panel2:#323232; --panel3:#3a3a3a;
    --line:#464646; --text:#d4d4d4; --text-dim:#9a9a9a; --accent:#2d7ff9;
    --canvas-bg:#4a4a4a; --tool-active:#4a4a4a;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none;}
  html,body{height:100%; overflow:hidden;}
  body{background:var(--bg); color:var(--text); font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #app{display:flex; flex-direction:column; height:100vh;}

  /* Menu bar */
  #menubar{display:flex; align-items:center; background:#181818; border-bottom:1px solid var(--line); height:30px; padding:0 6px; gap:2px; flex:0 0 auto; z-index:100;}
  #menubar .brand{font-weight:700; color:#fff; padding:0 10px 0 6px; letter-spacing:.5px; display:flex; align-items:center; gap:6px;}
  #menubar .brand .logo{width:16px;height:16px;border-radius:3px;background:linear-gradient(135deg,#2d7ff9,#a64bf4 55%,#ff5da2);}
  .menu{position:relative;}
  .menu > .mlabel{padding:5px 10px; border-radius:4px; cursor:default;}
  .menu.open > .mlabel, .menu > .mlabel:hover{background:var(--panel3);}
  .menu .dropdown{position:absolute; top:26px; left:0; min-width:230px; background:var(--panel2); border:1px solid var(--line); border-radius:6px; box-shadow:0 8px 30px rgba(0,0,0,.5); padding:5px; display:none; z-index:200;}
  .menu.open .dropdown{display:block;}
  .menu .dropdown.right{left:auto; right:0;}
  .mitem{display:flex; justify-content:space-between; align-items:center; padding:5px 10px; border-radius:4px; cursor:default; white-space:nowrap; gap:24px;}
  .mitem:hover{background:var(--accent); color:#fff;}
  .mitem.disabled{color:#666; pointer-events:none;}
  .mitem .kbd{color:var(--text-dim); font-size:11px;}
  .mitem:hover .kbd{color:#dfe9ff;}
  .msep{height:1px; background:var(--line); margin:5px 6px;}
  .msub{color:var(--text-dim); font-size:10px; text-transform:uppercase; letter-spacing:.6px; padding:6px 10px 3px;}

  /* Options bar */
  #tabbar{display:none; align-items:flex-end; gap:2px; background:#181818; border-bottom:1px solid var(--line); height:30px; padding:0 6px; flex:0 0 auto; overflow-x:auto;}
  #tabbar .tab{display:flex; align-items:center; gap:8px; background:var(--panel2); color:var(--text-dim); border:1px solid var(--line); border-bottom:none; border-radius:6px 6px 0 0; padding:5px 10px; margin-top:4px; cursor:pointer; white-space:nowrap; font-size:12px;}
  #tabbar .tab.active{background:var(--panel); color:#fff;}
  #tabbar .tabclose{color:var(--text-dim); font-size:11px; padding:0 2px; border-radius:3px;}
  #tabbar .tabclose:hover{background:#c0392b; color:#fff;}
  #optionsbar{display:flex; align-items:center; gap:12px; background:var(--panel); border-bottom:1px solid var(--line); height:38px; padding:0 12px; flex:0 0 auto; overflow-x:auto;}
  #optionsbar .tool-name{font-weight:600; color:#fff; min-width:90px;}
  #optionsbar label{display:flex; align-items:center; gap:5px; color:var(--text-dim); white-space:nowrap;}
  #optionsbar input[type=range]{width:90px;}
  #optionsbar input[type=number]{width:52px; background:var(--panel3); border:1px solid var(--line); color:var(--text); border-radius:4px; padding:3px 5px;}
  #optionsbar select{background:var(--panel3); border:1px solid var(--line); color:var(--text); border-radius:4px; padding:3px 5px;}
  #optionsbar .val{color:var(--text); min-width:30px; display:inline-block;}
  #optionsbar button{background:var(--panel3); border:1px solid var(--line); color:var(--text); border-radius:4px; padding:4px 10px; cursor:pointer;}
  #optionsbar button:hover{background:var(--panel3); border-color:var(--accent);}

  /* Main */
  #main{display:flex; flex:1 1 auto; min-height:0;}

  /* Toolbar */
  #toolbar{width:46px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:6px 0; gap:2px; flex:0 0 auto; overflow-y:auto;}
  .tool{width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:5px; cursor:pointer; color:#cfcfcf; position:relative;}
  .tool:hover{background:var(--panel3);}
  .tool.active{background:var(--accent); color:#fff;}
  .tool svg{width:20px; height:20px; pointer-events:none;}
  .tool .corner{position:absolute; right:2px; bottom:2px; width:0;height:0;border-left:4px solid transparent;border-bottom:4px solid #888;}
  .toolsep{height:1px; width:26px; background:var(--line); margin:4px 0;}
  #colorwells{position:relative; width:38px; height:38px; margin-top:6px;}
  #colorwells .well{position:absolute; width:22px; height:22px; border:1px solid #000; border-radius:2px; box-shadow:0 0 0 1px #6a6a6a; cursor:pointer;}
  #fgWell{top:0; left:0; background:#000; z-index:2;}
  #bgWell{bottom:0; right:0; background:#fff; z-index:1;}
  #swapColors{position:absolute; top:-2px; right:-2px; width:12px;height:12px;cursor:pointer;color:#bbb;}
  #resetColors{position:absolute; bottom:-2px; left:-2px; width:11px;height:11px;cursor:pointer;}

  /* Canvas area */
  #stage{flex:1 1 auto; position:relative; overflow:hidden; background:var(--canvas-bg); min-width:0;}
  #canvasWrap{position:absolute; transform-origin:0 0; box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 10px 40px rgba(0,0,0,.4);}
  #checker{position:absolute; inset:0; background-image:
    linear-gradient(45deg,#bfbfbf 25%,transparent 25%),
    linear-gradient(-45deg,#bfbfbf 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#bfbfbf 75%),
    linear-gradient(-45deg,transparent 75%,#bfbfbf 75%);
    background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0px; background-color:#fff;}
  #view{display:none;} /* offscreen doc-resolution compositing buffer (read by adjustments/channels/export) */
  #display{position:absolute; left:0; top:0; width:100%; height:100%; image-rendering:auto;} /* hi-DPI: backing is doc×DPR, CSS box fills the doc-sized wrap (canvas is a replaced element, so inset:0 alone would use its 2× intrinsic size) */
  #overlay{position:absolute; inset:0; pointer-events:none;}
  #stageInfo{position:absolute; left:8px; bottom:6px; background:rgba(0,0,0,.55); padding:3px 8px; border-radius:4px; color:#eee; font-size:11px; pointer-events:none;}

  /* Right panels */
  #rightpanels{width:280px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; flex:0 0 auto;}
  .pgroup{border-bottom:1px solid var(--line); display:flex; flex-direction:column; min-height:0;}
  .pgroup .ptabs{display:flex; background:var(--panel2); border-bottom:1px solid var(--line);}
  .ptab{padding:7px 12px; font-size:11px; color:var(--text-dim); cursor:pointer; border-right:1px solid var(--line);}
  .ptab.active{color:#fff; background:var(--panel);}
  .pbody{padding:10px; overflow-y:auto;}

  /* Color panel */
  #sv{position:relative; width:100%; height:120px; border-radius:4px; cursor:crosshair; overflow:hidden;}
  #svCursor{position:absolute; width:12px;height:12px;border:2px solid #fff; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 1px #000; pointer-events:none;}
  #hue{position:relative; width:100%; height:14px; margin-top:8px; border-radius:3px; cursor:pointer;
    background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);}
  #hueCursor{position:absolute; top:-2px; width:4px; height:18px; background:#fff; border:1px solid #000; border-radius:2px; transform:translateX(-50%); pointer-events:none;}
  .colorfields{display:flex; gap:6px; margin-top:8px; align-items:center;}
  .colorfields input{width:100%; background:var(--panel3); border:1px solid var(--line); color:var(--text); border-radius:4px; padding:4px 6px;}
  .swatches{display:flex; flex-wrap:wrap; gap:4px; margin-top:10px;}
  .swatch{width:16px; height:16px; border-radius:3px; border:1px solid #000; box-shadow:0 0 0 1px #5a5a5a; cursor:pointer;}

  /* Layers panel */
  #layerControls{display:flex; gap:8px; align-items:center; padding:6px 10px; background:var(--panel2); border-bottom:1px solid var(--line);}
  #layerControls select{flex:1; background:var(--panel3); border:1px solid var(--line); color:var(--text); border-radius:4px; padding:3px 5px;}
  #layerControls .op{display:flex; align-items:center; gap:4px; color:var(--text-dim);}
  #layerControls .op input{width:46px; background:var(--panel3); border:1px solid var(--line); color:var(--text); border-radius:4px; padding:3px;}
  #layerList{overflow-y:auto; flex:1 1 auto;}
  .layer{display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid #333; cursor:pointer;}
  .layer.active{background:#123a63;}
  .layer.primary{background:#0e3a6e; box-shadow:inset 3px 0 0 var(--accent);}
  .layer.grouped{padding-left:28px; box-shadow:inset 14px 0 0 -12px #4a5570;}
  .layer.group-header{gap:5px;}
  .layer .eye{width:18px; text-align:center; color:#bbb; cursor:pointer;}
  .layer .thumb{width:34px; height:34px; border:1px solid #000; background:#fff; flex:0 0 auto; background-size:cover; position:relative; overflow:hidden;}
  .layer .thumb canvas{width:100%;height:100%;}
  .layer .name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .layer .name input{width:100%; background:#111; border:1px solid var(--accent); color:#fff; border-radius:3px; padding:2px 4px;}
  .layer .lock{color:#888; font-size:11px;}
  #layerToolbar{display:flex; gap:2px; padding:5px 8px; background:var(--panel2); border-top:1px solid var(--line); justify-content:flex-end;}
  #layerToolbar .lbtn{width:26px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:4px; cursor:pointer; color:#cfcfcf;}
  #layerToolbar .lbtn:hover{background:var(--panel3);}
  #layerToolbar .lbtn.disabled{opacity:.35; pointer-events:none;}

  /* History panel */
  #historyList .hitem{padding:5px 10px; cursor:pointer; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
  #historyList .hitem.active{background:var(--accent); color:#fff;}
  #historyList .hitem:hover{background:var(--panel3);}
  #historyList .hitem.active:hover{background:var(--accent);}

  /* Dialog */
  #modalScrim{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:500;}
  #modalScrim.open{display:flex;}
  .dialog{background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.6); min-width:360px; max-width:92vw; max-height:90vh; overflow:auto;}
  .dialog h3{padding:14px 18px; border-bottom:1px solid var(--line); font-size:14px; color:#fff;}
  .dialog .dbody{padding:18px;}
  .dialog .row{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:12px;}
  .dialog .row label{color:var(--text-dim); min-width:120px;}
  .dialog .row input[type=number], .dialog .row input[type=text], .dialog .row select{background:var(--panel3); border:1px solid var(--line); color:var(--text); border-radius:5px; padding:6px 8px; width:130px;}
  .dialog .row input[type=range]{flex:1;}
  .dialog .rangeval{min-width:44px; text-align:right; color:var(--text);}
  .dialog .dfoot{display:flex; justify-content:flex-end; gap:10px; padding:14px 18px; border-top:1px solid var(--line);}
  .dialog button{padding:7px 16px; border-radius:6px; border:1px solid var(--line); background:var(--panel3); color:var(--text); cursor:pointer;}
  .dialog button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .dialog canvas.preview{border:1px solid var(--line); border-radius:4px; background:#111; width:100%;}
  #curveCanvas{background:#111; border:1px solid var(--line); border-radius:4px; cursor:crosshair;}

  input[type=range]{-webkit-appearance:none; height:4px; background:#555; border-radius:2px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:13px;height:13px;border-radius:50%; background:#ddd; cursor:pointer; border:1px solid #333;}
  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#555; border-radius:5px; border:2px solid var(--panel);}
  #toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#000c; color:#fff; padding:8px 16px; border-radius:6px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:900;}
  #toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <!-- MENU BAR -->
  <div id="menubar">
    <div class="brand"><span class="logo"></span>Prism</div>
    <div class="menu" data-menu="file"><div class="mlabel">File</div><div class="dropdown"></div></div>
    <div class="menu" data-menu="edit"><div class="mlabel">Edit</div><div class="dropdown"></div></div>
    <div class="menu" data-menu="image"><div class="mlabel">Image</div><div class="dropdown"></div></div>
    <div class="menu" data-menu="layer"><div class="mlabel">Layer</div><div class="dropdown"></div></div>
    <div class="menu" data-menu="select"><div class="mlabel">Select</div><div class="dropdown"></div></div>
    <div class="menu" data-menu="filter"><div class="mlabel">Filter</div><div class="dropdown"></div></div>
    <div class="menu" data-menu="view"><div class="mlabel">View</div><div class="dropdown"></div></div>
    <div class="menu" data-menu="help"><div class="mlabel">Help</div><div class="dropdown"></div></div>
  </div>

  <!-- DOCUMENT TABS -->
  <div id="tabbar"></div>

  <!-- OPTIONS BAR -->
  <div id="optionsbar"><span class="tool-name">Move</span></div>

  <div id="main">
    <!-- TOOLBAR -->
    <div id="toolbar"></div>

    <!-- STAGE -->
    <div id="stage">
      <div id="canvasWrap">
        <div id="checker"></div>
        <canvas id="view"></canvas>
        <canvas id="display"></canvas>
        <canvas id="overlay"></canvas>
      </div>
      <div id="stageInfo"></div>
    </div>

    <!-- RIGHT PANELS -->
    <div id="rightpanels">
      <div class="pgroup" style="flex:0 0 auto;">
        <div class="ptabs">
          <div class="ptab active" data-panel="color">Color</div>
          <div class="ptab" data-panel="swatches">Swatches</div>
          <div class="ptab" data-panel="adjust">Adjust</div>
        </div>
        <div class="pbody" id="panel-color">
          <div id="sv"><div id="svCursor"></div></div>
          <div id="hue"><div id="hueCursor"></div></div>
          <div class="colorfields">
            <span style="color:var(--text-dim)">Hex</span>
            <input id="hexInput" value="#000000" spellcheck="false">
          </div>
          <div class="colorfields">
            <label style="color:var(--text-dim)">R<input id="rIn" type="number" min="0" max="255" value="0"></label>
            <label style="color:var(--text-dim)">G<input id="gIn" type="number" min="0" max="255" value="0"></label>
            <label style="color:var(--text-dim)">B<input id="bIn" type="number" min="0" max="255" value="0"></label>
          </div>
        </div>
        <div class="pbody hidden" id="panel-swatches">
          <div class="swatches" id="swatchGrid"></div>
        </div>
        <div class="pbody hidden" id="panel-adjust">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
            <button class="qadj" data-adj="brightcontrast">Brightness/Contrast</button>
            <button class="qadj" data-adj="levels">Levels</button>
            <button class="qadj" data-adj="curves">Curves</button>
            <button class="qadj" data-adj="huesat">Hue/Saturation</button>
            <button class="qadj" data-adj="colorbalance">Color Balance</button>
            <button class="qadj" data-adj="vibrance">Vibrance</button>
            <button class="qadj" data-adj="exposure">Exposure</button>
            <button class="qadj" data-adj="invert">Invert</button>
            <button class="qadj" data-adj="desaturate">Desaturate</button>
            <button class="qadj" data-adj="blackwhite">Black &amp; White</button>
            <button class="qadj" data-adj="channelmixer">Channel Mixer</button>
            <button class="qadj" data-adj="selectivecolor">Selective Color</button>
            <button class="qadj" data-adj="photofilter">Photo Filter</button>
            <button class="qadj" data-adj="threshold">Threshold</button>
            <button class="qadj" data-adj="posterize">Posterize</button>
            <button class="qadj" data-adj="gradientmap">Gradient Map</button>
          </div>
        </div>
      </div>

      <div class="pgroup" style="flex:1 1 auto;">
        <div class="ptabs">
          <div class="ptab active" data-panel="layers">Layers</div>
          <div class="ptab" data-panel="history">History</div>
          <div class="ptab" data-panel="channels">Channels</div>
        </div>
        <div id="panel-layers" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0;">
          <div id="layerControls">
            <select id="blendMode">
              <optgroup label="Normal"><option value="source-over">Normal</option></optgroup>
              <optgroup label="Darken"><option value="darken">Darken</option><option value="multiply">Multiply</option><option value="color-burn">Color Burn</option></optgroup>
              <optgroup label="Lighten"><option value="lighten">Lighten</option><option value="screen">Screen</option><option value="color-dodge">Color Dodge</option></optgroup>
              <optgroup label="Contrast"><option value="overlay">Overlay</option><option value="soft-light">Soft Light</option><option value="hard-light">Hard Light</option></optgroup>
              <optgroup label="Comparative"><option value="difference">Difference</option><option value="exclusion">Exclusion</option></optgroup>
              <optgroup label="Component"><option value="hue">Hue</option><option value="saturation">Saturation</option><option value="color">Color</option><option value="luminosity">Luminosity</option></optgroup>
            </select>
            <div class="op">Op<input id="layerOpacity" type="number" min="0" max="100" value="100">%</div>
          </div>
          <div id="layerList"></div>
          <div id="layerToolbar">
            <div class="lbtn" id="lbLink" title="Link">🔗</div>
            <div class="lbtn" id="lbFx" title="Layer Style">ƒ</div>
            <div class="lbtn" id="lbMask" title="Add Mask">▢</div>
            <div class="lbtn" id="lbAdjust" title="New Adjustment">◐</div>
            <div class="lbtn" id="lbGroup" title="Group">📁</div>
            <div class="lbtn" id="lbNew" title="New Layer">➕</div>
            <div class="lbtn" id="lbDup" title="Duplicate">⧉</div>
            <div class="lbtn" id="lbDelete" title="Delete">🗑</div>
          </div>
        </div>
        <div class="pbody hidden" id="panel-history" style="padding:0;"><div id="historyList"></div></div>
        <div class="pbody hidden" id="panel-channels"><div id="channelList"></div></div>
      </div>
    </div>
  </div>
</div>

<div id="modalScrim"><div class="dialog" id="dialog"></div></div>
<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*,.psd,.prism,.json" class="hidden">

<script>
"use strict";
//====================================================================
//  PRISM — a browser-based image editor in the spirit of Photoshop
//  Self-contained. No dependencies. All logic below.
//====================================================================

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

//---------------- Global document state (the CURRENT document; swappable for multi-doc) ----------------
let State = {
  docId: 'D0',
  width: 800, height: 600,
  layers: [],            // {id,name,canvas,ctx,visible,opacity,blend,locked,type,text}
  activeId: null, selectedIds: [], selAnchor: null,
  fg: {r:0,g:0,b:0}, bg:{r:255,g:255,b:255},
  tool: 'move',
  zoom: 1, panX: 0, panY: 0,
  selection: null,       // {mask:Uint8ClampedArray(w*h), bounds:{x,y,w,h}} or null
  history: [], histIndex: -1,
  hsv: {h:0,s:0,v:0},
  fileName: 'Untitled',
};
let LID = 1;
const uid = ()=> 'L'+(LID++);

//---------------- Canvas refs ----------------
const view = $('#view'), vctx = view.getContext('2d');
const display = $('#display'), dctx = display.getContext('2d');
const overlay = $('#overlay'), octx = overlay.getContext('2d');
const wrap = $('#canvasWrap'), stage = $('#stage');
// Retina: cap the device-pixel-ratio we honour (2 is plenty; avoids 3x memory blow-ups on triple-density panels)
const DPRMAX = Math.min(window.devicePixelRatio||1, 2);
let DPR = DPRMAX; // effective ratio for the current doc (reduced for very large canvases in resizeCanvases)
// Blit the doc-resolution buffer onto the hi-DPI display canvas so it renders at native device pixels.
function blitDisplay(){
  if(!display.width) return;
  const crisp = State.zoom > 8;               // only extreme zoom → nearest-neighbour for true per-pixel inspection (design work stays smooth)
  dctx.setTransform(display.width/State.width,0,0,display.height/State.height,0,0);
  dctx.imageSmoothingEnabled = !crisp;
  if(!crisp) dctx.imageSmoothingQuality = 'high';
  dctx.clearRect(0,0,State.width,State.height);
  dctx.drawImage(view,0,0);
}

//====================================================================
//  MULTI-DOCUMENT (tabs) — State is the current doc; documents holds them all
//====================================================================
let DOCID=1;
const documents=[State];
// Build a fresh, independent document state (its own layers sized to w×h).
function makeDocState(w,h,bg,title){
  const st={ docId:'D'+(DOCID++), width:w, height:h, layers:[], activeId:null, selectedIds:[], selAnchor:null,
    fg:{...State.fg}, bg:{...State.bg}, tool:State.tool, zoom:1, panX:0, panY:0,
    selection:null, history:[], histIndex:-1, hsv:{...State.hsv}, fileName:title||'Untitled', soEdit:null };
  const base=newLayer('Background',{},w,h);
  if(bg==='white'){ base.ctx.fillStyle='#fff'; base.ctx.fillRect(0,0,w,h); }
  else if(bg==='black'){ base.ctx.fillStyle='#000'; base.ctx.fillRect(0,0,w,h); }
  st.layers.push(base); st.activeId=base.id;
  return st;
}
function openDocState(st){ documents.push(st); switchToDoc(st.docId); }
function switchToDoc(docId){
  if(xf&&xf.active){ toast('Finish the transform first (Enter/Esc)'); return; }
  if(lq&&lq.active){ toast('Finish Liquify first (Enter/Esc)'); return; }
  const target=documents.find(d=>d.docId===docId); if(!target) return;
  if(target!==State){ target.tool=State.tool; target.fg={...State.fg}; target.bg={...State.bg}; target.hsv={...State.hsv}; }
  State=target;
  resizeCanvases(); setFg(State.fg,true);
  renderToolbar(); renderOptionsBar(); renderLayerList(); renderHistory();
  composite(); drawSelectionOverlay(); fitToScreen(); renderTabs();
}

//====================================================================
//  VIEW TRANSFORM
//====================================================================
function applyTransform(){
  wrap.style.transform = `translate(${State.panX}px,${State.panY}px) scale(${State.zoom})`;
  wrap.style.width = State.width+'px'; wrap.style.height=State.height+'px';
  // smooth (bilinear) scaling for normal viewing; crisp nearest-neighbour only when zoomed in far enough to inspect pixels
  const px = State.zoom > 8 ? 'pixelated' : 'auto';
  display.style.imageRendering = px; overlay.style.imageRendering = px;
  blitDisplay(); // re-blit so the crisp/smooth threshold tracks the current zoom
  $('#stageInfo').textContent = `${State.width} × ${State.height} px  •  ${Math.round(State.zoom*100)}%  •  ${State.fileName}`;
}
let autoFit=true;
function fitToScreen(){
  autoFit=true;
  const pad=60;
  const sw=stage.clientWidth-pad, sh=stage.clientHeight-pad;
  if(sw<20||sh<20) return; // stage not laid out yet; ResizeObserver will refit
  State.zoom = Math.min(sw/State.width, sh/State.height, 4);
  State.panX = (stage.clientWidth - State.width*State.zoom)/2;
  State.panY = (stage.clientHeight - State.height*State.zoom)/2;
  applyTransform();
}
function setZoom(z, cx, cy){
  autoFit=false;
  z=clamp(z,0.02,32);
  const rect=stage.getBoundingClientRect();
  cx = cx==null? rect.width/2 : cx; cy = cy==null? rect.height/2 : cy;
  const ix=(cx-State.panX)/State.zoom, iy=(cy-State.panY)/State.zoom;
  State.zoom=z;
  State.panX = cx - ix*z; State.panY = cy - iy*z;
  applyTransform();
}

function resizeCanvases(){
  for(const c of [view,overlay]){ c.width=State.width; c.height=State.height; }
  overlay.width=State.width; overlay.height=State.height;
  // Hi-DPI display buffer: doc-size × DPR, clamped so we never exceed the browser's max canvas dimension.
  const maxDim=8192;
  DPR = Math.max(1, Math.min(DPRMAX, maxDim/State.width, maxDim/State.height));
  display.width = Math.round(State.width*DPR);
  display.height = Math.round(State.height*DPR);
}

//====================================================================
//  DOCUMENT LIFECYCLE
//====================================================================
function newDocument(w,h,bg){
  State.width=w; State.height=h;
  State.layers=[]; State.activeId=null; State.selection=null;
  State.history=[]; State.histIndex=-1;
  resizeCanvases();
  const base = newLayer('Background');
  // Fill with white/black, any hex/CSS colour, or leave empty for transparent/falsy.
  if(bg && bg!=='transparent'){ const c=base.ctx; c.fillStyle='#000'; c.fillStyle=(bg==='white')?'#fff':(bg==='black')?'#000':bg; c.fillRect(0,0,w,h); }
  // Background stays editable (PS-style lock is position-only).
  base.locked = false;
  State.layers.push(base); State.activeId=base.id;
  renderLayerList(); composite(); fitToScreen();
  pushHistory('New');
}

function rgbToHex(c){ return '#'+[c.r,c.g,c.b].map(x=>clamp(Math.round(x),0,255).toString(16).padStart(2,'0')).join(''); }

function setFg(c, syncPicker=true){

  if(syncPicker){ State.hsv=rgbToHsv(c.r,c.g,c.b); updateColorPanel(); }
  $('#hexInput').value=rgbToHex(c); $('#rIn').value=c.r; $('#gIn').value=c.g; $('#bIn').value=c.b;
}
function updateColorPanel(){
  const {h,s,v}=State.hsv;
  const base=hsvToRgb(h,1,1);
  $('#sv').style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${rgbToHex(base)})`;
  $('#svCursor').style.left=(s*100)+'%'; $('#svCursor').style.top=((1-v)*100)+'%';
  $('#hueCursor').style.left=(h/360*100)+'%';
}

function pushHistory(label){

function undo(){ if(State.histIndex>0){ State.histIndex--; restore(State.history[State.histIndex].snap); renderHistory(); toast('Undo'); } }

//====================================================================
//  SELECTION
//====================================================================
function clearSelection(){ State.selection=null; drawSelectionOverlay(); }
function selectionMaskAt(x,y){
  if(!State.selection) return 255;
  x=Math.floor(x); y=Math.floor(y);
  if(x<0||y<0||x>=State.width||y>=State.height) return 0;
  return State.selection.mask[y*State.width+x];
}
let antsPhase=0, antsTimer=null;
function drawSelectionOverlay(){
  if((xf&&xf.active)||(lq&&lq.active)){ if(antsTimer){cancelAnimationFrame(antsTimer);antsTimer=null;} return; } // transform/liquify own the overlay
  octx.setTransform(1,0,0,1,0,0);
  octx.clearRect(0,0,State.width,State.height);
  if(!State.selection){ if(antsTimer){cancelAnimationFrame(antsTimer);antsTimer=null;} return; }
  const {mask}=State.selection, W=State.width,H=State.height;
  // edge detection → marching ants
  const img=octx.createImageData(W,H); const d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x, m=mask[i]>127;
    let edge=false;
    if(m){
      if(x===0||y===0||x===W-1||y===H-1) edge=true;
      else if(!(mask[i-1]>127)||!(mask[i+1]>127)||!(mask[i-W]>127)||!(mask[i+W]>127)) edge=true;
    }
    if(edge){
      const on=((x+y+antsPhase)>>2)&1;
      const c=on?0:255; const p=i*4;
      d[p]=c;d[p+1]=c;d[p+2]=c;d[p+3]=255;
    }
  }
  octx.putImageData(img,0,0);
  if(!antsTimer){ const anim=()=>{ antsPhase=(antsPhase+1)%8; drawSelectionOverlay(); antsTimer=requestAnimationFrame(anim); }; antsTimer=requestAnimationFrame(anim); }
}
function setRectSelection(x0,y0,x1,y1,shape='rect'){
  const W=State.width,H=State.height;
  const mask=new Uint8ClampedArray(W*H);
  const xa=Math.max(0,Math.floor(Math.min(x0,x1))), xb=Math.min(W,Math.ceil(Math.max(x0,x1)));
  const ya=Math.max(0,Math.floor(Math.min(y0,y1))), yb=Math.min(H,Math.ceil(Math.max(y0,y1)));
  if(shape==='ellipse'){
    const cx=(x0+x1)/2, cy=(y0+y1)/2, rx=Math.abs(x1-x0)/2, ry=Math.abs(y1-y0)/2;
    for(let y=ya;y<yb;y++)for(let x=xa;x<xb;x++){ const nx=(x+.5-cx)/(rx||1), ny=(y+.5-cy)/(ry||1); if(nx*nx+ny*ny<=1) mask[y*W+x]=255; }
  } else {
    for(let y=ya;y<yb;y++)for(let x=xa;x<xb;x++) mask[y*W+x]=255;
  }
  State.selection={mask,bounds:{x:xa,y:ya,w:xb-xa,h:yb-ya}};
  drawSelectionOverlay();
}
function setPolygonSelection(points){
  const W=State.width,H=State.height; const mask=new Uint8ClampedArray(W*H);
  let minx=W,miny=H,maxx=0,maxy=0;
  for(const p of points){ minx=Math.min(minx,p.x);miny=Math.min(miny,p.y);maxx=Math.max(maxx,p.x);maxy=Math.max(maxy,p.y); }
  minx=clamp(Math.floor(minx),0,W);maxx=clamp(Math.ceil(maxx),0,W);miny=clamp(Math.floor(miny),0,H);maxy=clamp(Math.ceil(maxy),0,H);
  for(let y=miny;y<maxy;y++)for(let x=minx;x<maxx;x++){ if(pointInPoly(x+.5,y+.5,points)) mask[y*W+x]=255; }
  State.selection={mask,bounds:{x:minx,y:miny,w:maxx-minx,h:maxy-miny}};
  drawSelectionOverlay();
}
function pointInPoly(px,py,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
    if(((yi>py)!==(yj>py)) && (px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }

}
function magicWand(sx,sy,tol){
  const l=activeLayer(); if(!l)return;
  const W=State.width,H=State.height;
  const data=l.ctx.getImageData(0,0,W,H).data;
  sx=Math.floor(sx);sy=Math.floor(sy);
  if(sx<0||sy<0||sx>=W||sy>=H)return;
  const si=(sy*W+sx)*4; const sr=data[si],sg=data[si+1],sb=data[si+2],sa=data[si+3];

      if(y>0)stack.push(idx-W); if(y<H-1)stack.push(idx+W);

  for(let i=0;i<mask.length;i++)if(mask[i]){any=true;const x=i%W,y=(i/W)|0;minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x);maxy=Math.max(maxy,y);}
  State.selection = any? {mask,bounds:{x:minx,y:miny,w:maxx-minx+1,h:maxy-miny+1}} : null;

}
function selectAll(){ setRectSelection(0,0,State.width,State.height); }
function invertSelection(){
  if(!State.selection){ selectAll(); return; }
  const m=State.selection.mask; for(let i=0;i<m.length;i++)m[i]=255-m[i];
  recomputeBounds(); drawSelectionOverlay();
}
function recomputeBounds(){
  const W=State.width,H=State.height,m=State.selection.mask; let minx=W,miny=H,maxx=0,maxy=0,any=false;
  for(let i=0;i<m.length;i++)if(m[i]>0){any=true;const x=i%W,y=(i/W)|0;minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x);maxy=Math.max(maxy,y);}
  if(!any){State.selection=null;return;} State.selection.bounds={x:minx,y:miny,w:maxx-minx+1,h:maxy-miny+1};
}

//====================================================================
//  PIXEL OPERATIONS (adjustments + filters)
//   op(imageData) mutates in place; respects selection mask.
//====================================================================
function applyToActive(op, label){
  const l=activeLayer(); if(!l){toast('No layer');return;}
  if(l.locked){toast('Layer locked');return;}
  if(l.type==='group'){toast('Select a layer inside the group');return;}
  if(l.type==='adjust'){toast('Adjustment layer — double-click it to edit');return;}
  if(l.smart){toast('Smart object — rasterize the layer to apply this');return;}
  const W=State.width,H=State.height;
  const img=l.ctx.getImageData(0,0,W,H);
  const orig = State.selection? new Uint8ClampedArray(img.data) : null;
  op(img,W,H);
  if(State.selection){ // blend by selection mask
    const d=img.data, m=State.selection.mask;
    for(let i=0;i<m.length;i++){ const a=m[i]/255; if(a<1){ const p=i*4; for(let k=0;k<4;k++) d[p+k]=orig[p+k]*(1-a)+d[p+k]*a; } }
  }
  l.ctx.putImageData(img,0,0);
  fxInvalidate(l); composite();
  if(label) pushHistory(label);
}

//---- Adjustments ----
const Adjust = {
  brightnessContrast(img,b,c){ const d=img.data; const f=(259*(c+255))/(255*(259-c)); for(let i=0;i<d.length;i+=4){ for(let k=0;k<3;k++){ let v=d[i+k]+b; v=f*(v-128)+128; d[i+k]=clamp(v,0,255); } } },
  levels(img,inLow,inHigh,gamma,outLow,outHigh){ const d=img.data; const lut=new Uint8ClampedArray(256); for(let i=0;i<256;i++){ let v=(i-inLow)/(inHigh-inLow); v=clamp(v,0,1); v=Math.pow(v,1/gamma); v=outLow+v*(outHigh-outLow); lut[i]=clamp(v,0,255);} for(let i=0;i<d.length;i+=4){d[i]=lut[d[i]];d[i+1]=lut[d[i+1]];d[i+2]=lut[d[i+2]];} },
  curvesLUT(img,lut){ const d=img.data; for(let i=0;i<d.length;i+=4){d[i]=lut[d[i]];d[i+1]=lut[d[i+1]];d[i+2]=lut[d[i+2]];} },
  // Per-channel curves: each channel goes through its own curve, then the composite RGB curve (l.rgb∘l.channel).
  curvesRGB(img,luts){ const d=img.data,rgb=luts.rgb,rr=luts.r,gg=luts.g,bb=luts.b; for(let i=0;i<d.length;i+=4){ d[i]=rgb[rr[d[i]]]; d[i+1]=rgb[gg[d[i+1]]]; d[i+2]=rgb[bb[d[i+2]]]; } },
  hueSat(img,dh,ds,dl){ dh=dh||0; ds=ds||0; dl=dl||0; const d=img.data; for(let i=0;i<d.length;i+=4){ let {h,s,v}=rgbToHsv(d[i],d[i+1],d[i+2]); h=(h+dh)%360; if(h<0)h+=360; s=clamp(s*(1+ds/100),0,1); v=clamp(v*(1+dl/100),0,1); const c=hsvToRgb(h,s,v); d[i]=c.r;d[i+1]=c.g;d[i+2]=c.b; } },
  vibrance(img,amt){ const d=img.data; for(let i=0;i<d.length;i+=4){ const mx=Math.max(d[i],d[i+1],d[i+2]),avg=(d[i]+d[i+1]+d[i+2])/3; const amtF=((mx-avg)/255)*amt*-1; for(let k=0;k<3;k++){ d[i+k]+= (mx-d[i+k])*(amtF/100); d[i+k]=clamp(d[i+k],0,255);} } },
  colorBalance(img,r,g,b){ const d=img.data; for(let i=0;i<d.length;i+=4){ d[i]=clamp(d[i]+r,0,255); d[i+1]=clamp(d[i+1]+g,0,255); d[i+2]=clamp(d[i+2]+b,0,255);} },
  exposure(img,ev){ const f=Math.pow(2,ev); const d=img.data; for(let i=0;i<d.length;i+=4){ d[i]=clamp(d[i]*f,0,255);d[i+1]=clamp(d[i+1]*f,0,255);d[i+2]=clamp(d[i+2]*f,0,255);} },
  invert(img){ const d=img.data; for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];} },
  desaturate(img){ const d=img.data; for(let i=0;i<d.length;i+=4){ const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; d[i]=d[i+1]=d[i+2]=g;} },
  threshold(img,t){ const d=img.data; for(let i=0;i<d.length;i+=4){ const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; const v=g>=t?255:0; d[i]=d[i+1]=d[i+2]=v;} },
  posterize(img,levels){ const d=img.data; const step=255/(levels-1); for(let i=0;i<d.length;i+=4){ for(let k=0;k<3;k++) d[i+k]=Math.round(Math.round(d[i+k]/step)*step);} },
  gradientMap(img,c1,c2){ const d=img.data; for(let i=0;i<d.length;i+=4){ const g=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255; d[i]=c1.r+(c2.r-c1.r)*g; d[i+1]=c1.g+(c2.g-c1.g)*g; d[i+2]=c1.b+(c2.b-c1.b)*g;} },

// Unified op lookup so a smart-stack entry can be either a filter or an adjustment.
function opSpec(kind){ return FILTERS[kind]||ADJREG[kind]; }
function opName(kind){ const s=opSpec(kind); return (s&&s.name)||kind; }
function isAdjustmentOp(kind){ return !!ADJREG[kind]; }
function runOp(kind, params, img, W, H){ const s=opSpec(kind); if(s) s.run(img,W,H,params||{}); }
function runFilter(kind, params, img, W, H){ runOp(kind, params, img, W, H); }

//====================================================================
//  SMART OBJECTS + NON-DESTRUCTIVE SMART FILTERS
//====================================================================
function convertToSmartObject(l){
  l=l||activeLayer(); if(!l){toast('No layer');return;}
  if(l.smart){toast('Already a smart object');return;}
  // embed the current pixels as content at their native (content-bounds) resolution
  const bb=contentBounds(l.canvas);
  const content=document.createElement('canvas'); content.width=bb.w; content.height=bb.h;
  content.getContext('2d').drawImage(l.canvas, bb.x,bb.y,bb.w,bb.h, 0,0,bb.w,bb.h);
  l.smart=true; l.soContent=content; l.soTransform={cx:bb.x+bb.w/2, cy:bb.y+bb.h/2, w:bb.w, h:bb.h, angle:0};
  l.smartSource=makeLayerCanvas(); l.smartFilters=[];
  rebuildSmartSource(l); renderSmartFilters(l);
  renderLayerList(); composite(); pushHistory('Convert to Smart Object'); toast('Converted to Smart Object');
}
// Render the embedded content through its transform into smartSource (the pre-filter input).
function rebuildSmartSource(l){
  if(!l.soContent||!l.soTransform){ return; }
  if(!l.smartSource||l.smartSource.width!==State.width||l.smartSource.height!==State.height) l.smartSource=makeLayerCanvas();
  const t=l.soTransform, c=l.soContent, ctx=l.smartSource.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,State.width,State.height);
  ctx.save(); ctx.translate(t.cx,t.cy); ctx.rotate(t.angle||0); ctx.scale(t.w/c.width, t.h/c.height); ctx.imageSmoothingQuality='high';
  ctx.drawImage(c, -c.width/2, -c.height/2); ctx.restore();
}
// After a document-level transform, re-embed the (already transformed) smartSource as fresh content.
function resnapSmartContent(l){ if(!l.soContent||!l.smartSource)return; const bb=contentBounds(l.smartSource); const c=document.createElement('canvas'); c.width=Math.max(1,bb.w); c.height=Math.max(1,bb.h); c.getContext('2d').drawImage(l.smartSource, bb.x,bb.y,bb.w,bb.h, 0,0,bb.w,bb.h); l.soContent=c; l.soTransform={cx:bb.x+bb.w/2, cy:bb.y+bb.h/2, w:bb.w, h:bb.h, angle:0}; }
function rasterizeLayer(l){
  l=l||activeLayer(); if(!l)return;
  if(l.type==='shape' && l.shape){ renderShapeLayer(l); l.type='pixel'; l.shape=null; renderLayerList(); composite(); pushHistory('Rasterize Shape'); toast('Shape rasterized'); return; }
  if(!l.smart)return;
  renderSmartFilters(l); // ensure canvas reflects current stack
  l.smart=false; l.smartSource=null; l.smartFilters=null; l.soContent=null; l.soTransform=null;
  renderLayerList(); composite(); pushHistory('Rasterize Layer'); toast('Rasterized');
}
// Replace the embedded image, keeping the transform box + smart filters (PS "Replace Contents").
function replaceSmartContents(l){ l=l||activeLayer(); if(!l||!l.smart){toast('Not a smart object');return;}
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); l.soContent=c; rebuildSmartSource(l); renderSmartFilters(l); composite(); renderLayerList(); pushHistory('Replace Contents'); toast('Contents replaced'); }; img.src=URL.createObjectURL(f); };
  inp.click();
}
// Reset scale/rotation, restoring the embedded content at its native size (kept at current center).
function resetSmartTransform(l){ l=l||activeLayer(); if(!l||!l.smart||!l.soTransform){toast('Not a smart object');return;} l.soTransform={cx:l.soTransform.cx, cy:l.soTransform.cy, w:l.soContent.width, h:l.soContent.height, angle:0}; rebuildSmartSource(l); renderSmartFilters(l); composite(); renderLayerList(); pushHistory('Reset Transform'); toast('Transform reset'); }
// Open the embedded contents in its own document tab; editing there and Updating writes back.
function editSmartContents(l){
  l=l||activeLayer(); if(!l||!l.smart||!l.soContent){toast('Not a smart object');return;}
  // if an edit session for this SO already exists, just switch to it
  const existing=documents.find(d=>d.soEdit&&d.soEdit.docId===State.docId&&d.soEdit.layerId===l.id);
  if(existing){ switchToDoc(existing.docId); return; }
  const src=l.soContent;
  const st=makeDocState(src.width, src.height, 'transparent', (l.name||'Smart')+' — Contents');
  const base=st.layers[0]; base.ctx.drawImage(src,0,0); base.name='Content'; base.locked=false;
  st.soEdit={docId:State.docId, layerId:l.id};
  openDocState(st); pushHistory('Edit Contents');
  toast('Editing Smart Object contents — Layer ▸ Update Smart Object (⌘S) to apply');
}
// Flatten the current edit-session document and write it back into the linked smart object.
function updateSmartFromEdit(){
  if(!State.soEdit){ return false; }
  const {docId, layerId}=State.soEdit;
  const target=documents.find(d=>d.docId===docId);
  if(!target){ toast('Parent document was closed'); return true; }
  const layer=target.layers.find(x=>x.id===layerId);
  if(!layer){ toast('Smart object no longer exists'); return true; }
  const flat=document.createElement('canvas'); flat.width=State.width; flat.height=State.height; const fctx=flat.getContext('2d');
  for(const ly of State.layers){ if(!ly.visible||ly.opacity<=0)continue; fctx.globalAlpha=ly.opacity/100; fctx.globalCompositeOperation=ly.blend; fctx.drawImage(ly.canvas,0,0); }
  fctx.globalAlpha=1; fctx.globalCompositeOperation='source-over';
  layer.soContent=flat;
  const saved=State; State=target; rebuildSmartSource(layer); renderSmartFilters(layer); State=saved; // rebuild the instance in its own doc's coordinate space
  toast('Smart object updated');
  return true;
}
function renderSmartFilters(l){ // rebuild l.canvas = smartSource ▸ enabled filters (in order)
  if(!l.smart||!l.smartSource) return;
  const W=State.width,H=State.height; const ctx=l.ctx; ctx.clearRect(0,0,W,H);
  const ss=l.smartSource;
  if(ss.width!==W||ss.height!==H) ctx.drawImage(ss,0,0,ss.width,ss.height,0,0,W,H); else ctx.drawImage(ss,0,0);
  const list=l.smartFilters||[];
  if(list.some(f=>f.enabled!==false)){
    const img=ctx.getImageData(0,0,W,H);
    for(const f of list){ if(f.enabled!==false) runFilter(f.kind,f.params,img,W,H); }
    ctx.putImageData(img,0,0);
  }
  l._fxDirty=true;
}
function addSmartOp(l, kind, params){ if(!l.smartFilters)l.smartFilters=[]; l.smartFilters.push({id:uid(), kind, params:{...params}, enabled:true}); renderSmartFilters(l); composite(); renderLayerList(); pushHistory((isAdjustmentOp(kind)?'Smart Adjustment: ':'Smart Filter: ')+opName(kind)); }
const addSmartFilter=addSmartOp; // back-compat alias
function toggleSmartFilter(l,f){ f.enabled=(f.enabled===false); renderSmartFilters(l); composite(); renderLayerList(); pushHistory('Toggle Smart Filter'); }
function deleteSmartFilter(l,f){ l.smartFilters=l.smartFilters.filter(x=>x!==f); renderSmartFilters(l); composite(); renderLayerList(); pushHistory('Delete Smart Filter'); }
function moveSmartFilter(l,f,dir){ const i=l.smartFilters.indexOf(f); const j=i+dir; if(j<0||j>=l.smartFilters.length)return; const a=l.smartFilters; [a[i],a[j]]=[a[j],a[i]]; renderSmartFilters(l); composite(); renderLayerList(); pushHistory('Reorder Smart Filter'); }

//====================================================================
//  ADJUSTMENT LAYERS (apply an op to everything below, non-destructively)
//====================================================================
function defaultSelectiveParams(){ const p={mode:'relative'}; ['reds','yellows','greens','cyans','blues','magentas','whites','neutrals','blacks'].forEach(k=>p[k]={c:0,m:0,y:0,k:0}); return p; }
function opDefaults(spec){ if(spec.special==='selectivecolor')return defaultSelectiveParams(); if(spec.special==='curves')return {curves:{rgb:[{x:0,y:255},{x:255,y:0}]}}; const p={}; (spec.params||[]).forEach(s=>p[s.id]=s.def); (spec.colors||[]).forEach(c=>p[c.id]=c.def); return p; }
// ---- Histogram (for Levels + Curves) ----
function computeHistogram(img){ const d=img.data; const r=new Float32Array(256),g=new Float32Array(256),b=new Float32Array(256),lum=new Float32Array(256);
  for(let i=0;i<d.length;i+=4){ if(d[i+3]<8)continue; r[d[i]]++; g[d[i+1]]++; b[d[i+2]]++; lum[(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])|0]++; }
  return {r,g,b,lum};
}
// The pixels a Levels/Curves adjustment reads: the active layer's pixels, or the composite for adjustment layers.
function histogramSource(){ const l=activeLayer(); if(l && l.type!=='adjust') return l.ctx.getImageData(0,0,State.width,State.height); return vctx.getImageData(0,0,State.width,State.height); }
function drawHistogram(ctx, w, h, arr, fill){ let mx=0; for(let i=0;i<256;i++)if(arr[i]>mx)mx=arr[i]; if(mx<=0)return; ctx.fillStyle=fill; ctx.beginPath(); ctx.moveTo(0,h); for(let i=0;i<256;i++){ const x=i/255*w; const v=Math.pow(arr[i]/mx,0.5); ctx.lineTo(x,h-v*h); } ctx.lineTo(w,h); ctx.closePath(); ctx.fill(); }

// Levels dialog with a histogram backdrop + input/output/gamma sliders.
function levelsDialog(title, params, onPreview, onCommit, onCancel, commitLabel){
  const D={il:0,g:100,ih:255,ol:0,oh:255}; for(const k in D) if(params[k]==null)params[k]=D[k];
  const body=`<canvas id="lvHist" width="256" height="86" style="width:100%;height:70px;display:block;background:#111;border:1px solid var(--line);border-radius:4px;margin-bottom:8px"></canvas>`
    +sliderRow('Input Black','il',0,254,params.il)+sliderRow('Gamma','g',10,300,params.g)+sliderRow('Input White','ih',1,255,params.ih)
    +sliderRow('Output Black','ol',0,255,params.ol)+sliderRow('Output White','oh',0,255,params.oh);
  showDialog(`<h3>${title}</h3><div class="dbody" style="min-width:300px">${body}</div>`, ()=>onCommit&&onCommit(), commitLabel||'OK', ()=>onCancel&&onCancel());
  const hist=computeHistogram(histogramSource());
  const cv=$('#lvHist'), ctx=cv.getContext('2d');
  const redraw=()=>{ ctx.clearRect(0,0,256,86); drawHistogram(ctx,256,86,hist.lum,'rgba(190,190,190,0.75)');
    // input black / white markers
    const bx=params.il/255*256, wx=params.ih/255*256; ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(bx,0);ctx.lineTo(bx,86); ctx.moveTo(wx,0);ctx.lineTo(wx,86); ctx.stroke();

// shared op-parameter form builder (used by adjustment-layer + smart-op dialogs)

let pointer={down:false, sx:0,sy:0, lx:0,ly:0, ix:0,iy:0, lastIx:0,lastIy:0, cloneSrc:null, cloneOffset:null, polyPoints:null, spaceDrag:false};
function screenToImage(e){
  const r=wrap.getBoundingClientRect();
  return { x:(e.clientX-r.left)/State.zoom, y:(e.clientY-r.top)/State.zoom };
}
function withBrush(ctx, fn){ ctx.save(); fn(ctx); ctx.restore(); }

function brushStampCtx(ctx,x,y,color,size,hardness,alpha){
  const r=size/2;
  if(hardness>=100){
    ctx.globalAlpha=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  } else {
    const grad=ctx.createRadialGradient(x,y,r*(hardness/100),x,y,r);
    const c=color; grad.addColorStop(0,`rgba(${c.r},${c.g},${c.b},${alpha})`); grad.addColorStop(1,`rgba(${c.r},${c.g},${c.b},0)`);
    ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
}
function paintLine(ctx,x0,y0,x1,y1,mode){
  const l=activeLayer(); const color=State.fg;
  const size=Opt.brushSize, hardness=(State.tool==='pencil')?100:Opt.brushHardness;
  const alpha=Opt.brushOpacity/100;
  const dist=Math.hypot(x1-x0,y1-y0); const step=Math.max(1,size/8); const n=Math.max(1,Math.ceil(dist/step));
  ctx.save();
  if(State.selection){ /* clip via mask done post-hoc is heavy; approximate by clip rect of bounds */ }
  for(let i=0;i<=n;i++){
    const t=i/n, x=x0+(x1-x0)*t, y=y0+(y1-y0)*t;
    if(mode==='erase'){ ctx.globalCompositeOperation='destination-out'; brushStampCtx(ctx,x,y,{r:0,g:0,b:0},size,hardness,alpha); }
    else if(mode==='pencil'){ ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=alpha; ctx.fillStyle=rgbToHex(color); ctx.fillRect(Math.round(x-size/2),Math.round(y-size/2),size,size); }
    else { ctx.globalCompositeOperation='source-over'; brushStampCtx(ctx,x,y,color,size,hardness,alpha); }
  }
  ctx.restore();
}
function floodFill(sx,sy,color,tol){
  const l=activeLayer(); if(!l)return; const ctx=editCtx(l); const W=State.width,H=State.height;
  const img=ctx.getImageData(0,0,W,H); const data=img.data;
  sx=Math.floor(sx);sy=Math.floor(sy); if(sx<0||sy<0||sx>=W||sy>=H)return;
  const si=(sy*W+sx)*4; const sr=data[si],sg=data[si+1],sb=data[si+2],sa=data[si+3];
  const t=tol*tol*3; const stack=[sy*W+sx]; const seen=new Uint8Array(W*H);
  const fr=color.r,fg=color.g,fb=color.b;
  while(stack.length){ const idx=stack.pop(); if(seen[idx])continue; seen[idx]=1; const p=idx*4;
    const dr=data[p]-sr,dg=data[p+1]-sg,db=data[p+2]-sb,da=data[p+3]-sa;
    if(dr*dr+dg*dg+db*db+da*da<=t){ if(State.selection && State.selection.mask[idx]<128)continue; data[p]=fr;data[p+1]=fg;data[p+2]=fb;data[p+3]=255; const x=idx%W,y=(idx/W)|0; if(x>0)stack.push(idx-1);if(x<W-1)stack.push(idx+1);if(y>0)stack.push(idx-W);if(y<H-1)stack.push(idx+W);} }
  ctx.putImageData(img,0,0); afterEdit(l);
}
function drawGradient(x0,y0,x1,y1){
  const l=activeLayer(); if(!l||l.locked)return; const ctx=editCtx(l);
  let grad;
  if(Opt.gradientType==='radial'){ const r=Math.hypot(x1-x0,y1-y0); grad=ctx.createRadialGradient(x0,y0,0,x0,y0,r||1); }
  else grad=ctx.createLinearGradient(x0,y0,x1,y1);
  grad.addColorStop(0,rgbToHex(State.fg)); grad.addColorStop(1,rgbToHex(State.bg));
  ctx.save();
  if(State.selection){ clipToSelection(ctx); }
  ctx.fillStyle=grad; ctx.fillRect(0,0,State.width,State.height); ctx.restore(); afterEdit(l);
}
function clipToSelection(ctx){

function localFilterStamp(x,y,kind){
  const l=activeLayer(); if(!l)return; const r=Opt.brushSize/2; const W=State.width,H=State.height;
  const x0=clamp(Math.floor(x-r),0,W), y0=clamp(Math.floor(y-r),0,H);
  const w=clamp(Math.ceil(r*2),1,W-x0), h=clamp(Math.ceil(r*2),1,H-y0);

let smudgeBuf=null;
function smudgeStamp(x,y){

  const W=State.width,H=State.height; const x0=clamp(Math.floor(x-r),0,W),y0=clamp(Math.floor(y-r),0,H);
  const w=clamp(Math.ceil(size),1,W-x0),h=clamp(Math.ceil(size),1,H-y0); if(w<=0||h<=0)return;

function onPointerDown(e){
  if(e.button===1 || (e.button===0 && pointer.spaceDrag)){ startPan(e); return; }
  if(e.button!==0)return;
  if(xf&&xf.active){ transformPointerDown(e); return; }
  if(lq&&lq.active){ liquifyPointerDown(e); return; }
  const p=screenToImage(e); pointer.down=true; pointer.ix=p.x;pointer.iy=p.y; pointer.lastIx=p.x;pointer.lastIy=p.y;
  pointer.sx=e.clientX; pointer.sy=e.clientY;
  const l=activeLayer();
  const tool=State.tool;

  if(tool==='pen'){ penDown(p, e); return; }
  if(tool==='pathedit'){ pathEditDown(p, e); return; }
  if(tool==='width'){ widthDown(p, e); return; }

  // Move: snapshot every selected, movable layer at drag-start (pristine pixels/geometry) so the
  // whole set moves together by the total delta — no cumulative resampling loss, off-canvas pixels
  // survive until commit. Shapes/text move by geometry; raster/mask by an offset blit.
  pointer.moveSet=null;
  if(tool==='move'){
    const targets = movableSelection();
    const set = targets.map(x=>{
      if(x.type==='shape' && x.shape){ if(x.shape.kind==='path') return {l:x, kind:'path', pts0:cloneShape(x.shape).pts}; return {l:x, kind:'shape', cx:x.shape.cx, cy:x.shape.cy}; }
      if(x.type==='text' && x.text){ if(x.text.onPath) return {l:x, kind:'textpath', pts0:cloneText(x.text).onPath.pts, tx:x.text.x, ty:x.text.y}; return {l:x, kind:'text', tx:x.text.x, ty:x.text.y}; }
      const snap=makeLayerCanvas(); snap.getContext('2d').drawImage(x.canvas,0,0);
      let maskSnap=null; if(x.mask){ maskSnap=makeLayerCanvas(); maskSnap.getContext('2d').drawImage(x.mask,0,0); }
      return {l:x, kind:'raster', snap, maskSnap};
    });
    if(set.length) pointer.moveSet=set;
  }

  if(tool==='hand'){ startPan(e); pointer.down=false; return; }
  if(tool==='zoom'){ const factor=e.altKey?1/Opt.zoomStep:Opt.zoomStep; const r=stage.getBoundingClientRect(); setZoom(State.zoom*factor,e.clientX-r.left,e.clientY-r.top); pointer.down=false; return; }
  // Smart objects protect their pixels — block direct paint/edit tools (move/select/zoom stay allowed)
  const paintTools=['brush','pencil','eraser','bucket','clone','gradient','blur','smudge','dodge','burn','shape-rect','shape-ellipse','shape-line','spotheal','heal','redeye','patch'];
  if(l&&l.smart&&paintTools.includes(tool)){ toast('Smart object — rasterize the layer to paint on it'); pointer.down=false; return; }
  // Group folders have no pixels — but shape tools still spawn a NEW shape layer, so allow those
  if(l&&l.type==='group'&&paintTools.includes(tool)&&!tool.startsWith('shape')){ toast('Select a layer inside the group to paint'); pointer.down=false; return; }
  // Live vector shapes protect their pixels too — but shape tools still spawn a NEW shape layer, so allow those
  if(l&&l.type==='shape'&&paintTools.includes(tool)&&!tool.startsWith('shape')){ toast('Vector shape — rasterize the layer to paint on it'); pointer.down=false; return; }
  // Adjustment layers have no pixels — paint tools only apply to their mask
  if(l&&l.type==='adjust'&&paintTools.includes(tool)&&!(l.maskActive&&l.mask)){ toast(l.mask?'Select the mask thumbnail to paint the adjustment’s area':'Add a mask to paint where this adjustment applies'); pointer.down=false; return; }
  if(tool==='eyedropper'){ pickColor(p.x,p.y); pointer.down=false; return; }
  if(tool==='wand'){ magicWand(p.x,p.y,Opt.tolerance); pointer.down=false; pushHistory('Magic Wand'); return; }

  const src=makeLayerCanvas(); src.getContext('2d').drawImage(l.canvas,0,0);
  const srcData=src.getContext('2d').getImageData(0,0,W,H).data;
  const map=new Float32Array(W*H*2); for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const p=(y*W+x)*2; map[p]=x; map[p+1]=y; }
  lq={active:true, layer:l, src, srcData, map, W, H, tool:'push', size:Math.round(Math.min(W,H)/3), strength:50, down:false, lastX:0, lastY:0};
  if(antsTimer){cancelAnimationFrame(antsTimer);antsTimer=null;}
  renderOptionsBar();
  toast('Liquify — drag to warp • Enter to apply • Esc to cancel');
}
function lqSampleBilinear(sd,W,H,fx,fy,out,oi){ fx=fx<0?0:fx>W-1?W-1:fx; fy=fy<0?0:fy>H-1?H-1:fy; const x0=fx|0,y0=fy|0,x1=x0+1<W?x0+1:x0,y1=y0+1<H?y0+1:y0,tx=fx-x0,ty=fy-y0; const i00=(y0*W+x0)*4,i10=(y0*W+x1)*4,i01=(y1*W+x0)*4,i11=(y1*W+x1)*4; for(let k=0;k<4;k++){ const a=sd[i00+k]*(1-tx)+sd[i10+k]*tx, b=sd[i01+k]*(1-tx)+sd[i11+k]*tx; out[oi+k]=a*(1-ty)+b*ty; } }
function liquifyStamp(cx,cy,mdx,mdy){ const {size,strength,tool,map,W,H}=lq; const R=size/2; const str=strength/100;
  const x0=clamp(Math.floor(cx-R),0,W), y0=clamp(Math.floor(cy-R),0,H), x1=clamp(Math.ceil(cx+R),0,W), y1=clamp(Math.ceil(cy+R),0,H);
  if(x1<=x0||y1<=y0)return;
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){ const dx=x-cx, dy=y-cy; const dist=Math.hypot(dx,dy); if(dist>R)continue; const f=Math.pow(1-dist/R,2)*str; const p=(y*W+x)*2;
    if(tool==='push'){ map[p]-=mdx*f; map[p+1]-=mdy*f; }
    else if(tool==='twirlcw'||tool==='twirlccw'){ const a=(tool==='twirlcw'?1:-1)*f*0.2; const c=Math.cos(a),s=Math.sin(a); const vx=map[p]-cx, vy=map[p+1]-cy; map[p]=cx+vx*c-vy*s; map[p+1]=cy+vx*s+vy*c; }
    else if(tool==='pinch'){ map[p]+=dx*f*0.5; map[p+1]+=dy*f*0.5; }
    else if(tool==='bloat'){ map[p]-=dx*f*0.35; map[p+1]-=dy*f*0.35; }
    else if(tool==='reconstruct'){ map[p]+=(x-map[p])*f; map[p+1]+=(y-map[p+1])*f; }
  }
  const rw=x1-x0, rh=y1-y0; const out=lq.layer.ctx.createImageData(rw,rh); const od=out.data;
  for(let yy=0;yy<rh;yy++)for(let xx=0;xx<rw;xx++){ const gx=x0+xx, gy=y0+yy; const p=(gy*W+gx)*2; lqSampleBilinear(lq.srcData,W,H,map[p],map[p+1],od,(yy*rw+xx)*4); }
  lq.layer.ctx.putImageData(out,x0,y0); lq.layer._fxDirty=true; composite();
}
function drawLiquifyCursor(p){ octx.setTransform(1,0,0,1,0,0); octx.clearRect(0,0,State.width,State.height); const z=State.zoom||1; octx.strokeStyle='rgba(45,127,249,0.9)'; octx.lineWidth=1.4/z; octx.beginPath(); octx.arc(p.x,p.y,lq.size/2,0,7); octx.stroke(); }
function liquifyPointerDown(e){ const p=screenToImage(e); lq.down=true; lq.lastX=p.x; lq.lastY=p.y; liquifyStamp(p.x,p.y,0,0); drawLiquifyCursor(p); }
function liquifyPointerMove(e){ const p=screenToImage(e); if(lq.down){ liquifyStamp(p.x,p.y,p.x-lq.lastX,p.y-lq.lastY); lq.lastX=p.x; lq.lastY=p.y; } drawLiquifyCursor(p); }
function liquifyPointerUp(){ lq.down=false; }
function commitLiquify(){ if(!lq||!lq.active)return; lq=null; octx.setTransform(1,0,0,1,0,0); octx.clearRect(0,0,State.width,State.height); renderOptionsBar(); composite(); drawSelectionOverlay(); pushHistory('Liquify'); toast('Liquify applied'); }
function cancelLiquify(){ if(!lq||!lq.active)return; const l=lq.layer; l.ctx.setTransform(1,0,0,1,0,0); l.ctx.clearRect(0,0,State.width,State.height); l.ctx.drawImage(lq.src,0,0); l._fxDirty=true; lq=null; octx.setTransform(1,0,0,1,0,0); octx.clearRect(0,0,State.width,State.height); renderOptionsBar(); composite(); drawSelectionOverlay(); toast('Liquify cancelled'); }

function paintThumb(canvas, src, isMask){
  const tc=canvas.getContext('2d'); tc.imageSmoothingEnabled=true;
  tc.clearRect(0,0,34,34);
  tc.fillStyle=isMask?'#000':'#fff'; tc.fillRect(0,0,34,34);
  if(!src) return;
  const scale=Math.min(34/State.width,34/State.height); const dw=State.width*scale,dh=State.height*scale;
  tc.drawImage(src,(34-dw)/2,(34-dh)/2,dw,dh);
}
function makeThumb(cls,src,isMask){ const wrap=document.createElement('div'); wrap.className='thumb '+cls; const cv=document.createElement('canvas'); cv.width=34;cv.height=34; wrap.appendChild(cv); paintThumb(cv,src,isMask); return wrap; }

  });
  syncLayerControls(); updateEditTargetIndicator();

  if(i>=0){ if(State.selectedIds.length>1){ State.selectedIds.splice(i,1); if(State.activeId===id) State.activeId=State.selectedIds[State.selectedIds.length-1]; } }
  else { State.selectedIds.push(id); State.activeId=id; }

function deleteLayerMask(l){ l=l||activeLayer(); if(!l||!l.mask)return; l.mask=null;l.maskCtx=null;l.maskActive=false;l._maskAlpha=null;l._maskDirty=false;l._fxDirty=true; renderLayerList(); composite(); pushHistory('Delete Layer Mask'); }

// ---- Layer groups (folders) ----
function groupHeaderFor(l){ if(!l)return null; if(l.type==='group')return l; const p=parentIdOf(l); return p? State.layers.find(x=>x.id===p) : null; }
function groupMembers(gid){ return childrenOf(gid); } // direct children (may include nested group headers)
function groupDepth(l){ let d=0,p=parentIdOf(l); while(p){ d++; const h=State.layers.find(x=>x.id===p); p=h?parentIdOf(h):null; } return d; }
function anyAncestorCollapsed(l){ let p=parentIdOf(l); while(p){ const h=State.layers.find(x=>x.id===p); if(!h)break; if(h.expanded===false) return true; p=parentIdOf(h); } return false; }
function isDescendant(l, ancestorId){ let p=parentIdOf(l); while(p){ if(p===ancestorId) return true; const h=State.layers.find(x=>x.id===p); p=h?parentIdOf(h):null; } return false; }
function subtreeIds(headerId){ const ids=[]; for(const c of childrenOf(headerId)){ ids.push(c.id); if(c.type==='group') ids.push(...subtreeIds(c.id)); } return ids; }
// Reorder State.layers into canonical contiguous form derived from the groupId tree, preserving each
// parent's current relative child order. Emits a group's descendants first, then its header (top of block).
function normalizeLayerOrder(){
  const byParent=new Map();
  for(const l of State.layers){ const k=parentIdOf(l)||''; if(!byParent.has(k))byParent.set(k,[]); byParent.get(k).push(l); }
  const out=[];
  (function emit(key){ for(const l of (byParent.get(key)||[])){ if(l.type==='group'){ emit(l.id); out.push(l); } else out.push(l); } })('');
  State.layers=out;
}
// Contiguous [start,end] array range of a layer's block (a plain layer, or a group's whole subtree+header).
function blockRange(l){ const L=State.layers, idx=L.indexOf(l);
  if(l.type!=='group') return [idx,idx];
  const sub=new Set([l.id, ...subtreeIds(l.id)]); let s=idx; while(s-1>=0 && sub.has(L[s-1].id)) s--; return [s,idx]; }
// Expand the selection to actual movable pixel/shape/text layers (a selected group → all its descendants).
function movableSelection(){
  const out=new Set();
  for(const l of selectedLayers()){
    if(l.type==='group'){ for(const id of subtreeIds(l.id)){ const x=State.layers.find(y=>y.id===id); if(x&&x.type!=='group') out.add(x); } }
    else out.add(l);
  }
  return State.layers.filter(l=>out.has(l) && !l.locked && l.type!=='adjust' && l.type!=='group');
}
function groupSelected(){
  // Group the selected items (may include existing folders → nesting). Drop any selected layer that is
  // already inside another selected group.
  let sel=selectedLayers();
  sel=sel.filter(l=> !sel.some(o=> o!==l && o.type==='group' && isDescendant(l,o.id)));
  if(!sel.length){ toast('Select one or more layers to group'); return; }
  const topIdx=Math.max(...sel.map(m=>State.layers.indexOf(m)));
  const topItem=State.layers[topIdx];
  const parentId=parentIdOf(topItem); // new group nests into the topmost item's current parent
  const header=newLayer('Group '+(State.layers.filter(l=>l.type==='group').length+1));
  header.type='group'; header.expanded=true; header.groupId=parentId;
  sel.forEach(m=>m.groupId=header.id);
  State.layers.splice(topIdx+1,0,header); // sibling slot ~ topmost item's position
  normalizeLayerOrder();
  State.activeId=header.id; State.selectedIds=[header.id]; State.selAnchor=header.id;
  renderLayerList(); composite(); pushHistory('Group Layers'); toast(sel.length+' layer(s) grouped');
}
function ungroupSelected(){
  const header=groupHeaderFor(activeLayer());
  if(!header){ toast('Select a group (folder) to ungroup'); return; }
  const gid=header.id, parent=parentIdOf(header); const kids=childrenOf(gid);
  kids.forEach(k=>k.groupId=parent); // reparent one level up (grandparent, or top level)
  State.layers=State.layers.filter(l=>l!==header); delete _groupTmp[gid];
  normalizeLayerOrder();
  State.activeId = kids.length? kids[kids.length-1].id : (State.layers[State.layers.length-1]||{}).id;
  State.selectedIds=kids.map(k=>k.id); State.selAnchor=State.activeId;
  renderLayerList(); composite(); pushHistory('Ungroup');
}
// Reorder a layer by direction (up/down/front/back) or absolute toIndex, AMONG ITS SIBLINGS. Group-aware
// & nesting-aware: a folder moves as its whole block; a nested layer reorders within its own group.
function moveLayerById(id, opts){
  opts=opts||{}; const l=State.layers.find(x=>x.id===id); if(!l) throw new Error('No such layer: '+id);
  const sibs=childrenOf(parentIdOf(l)); const ci=sibs.indexOf(l);
  const d=opts.direction; let t;
  if(opts.toIndex!=null) t=clamp(opts.toIndex|0,0,sibs.length-1);
  else if(d==='front'||d==='top') t=sibs.length-1;
  else if(d==='back'||d==='bottom') t=0;
  else if(d==='up') t=Math.min(sibs.length-1,ci+1);
  else if(d==='down') t=Math.max(0,ci-1);
  else throw new Error("Provide direction ('up'|'down'|'front'|'back') or toIndex");
  if(t!==ci){
    const blocks=sibs.map(s=>{ const [a,b]=blockRange(s); return {items:State.layers.slice(a,b+1), a, b}; });
    const start=blocks[0].a, end=blocks[blocks.length-1].b;
    const [m]=blocks.splice(ci,1); blocks.splice(t,0,m);
    State.layers=[...State.layers.slice(0,start), ...blocks.flatMap(b=>b.items), ...State.layers.slice(end+1)];
  }
  setActiveLayer(l.id); renderLayerList(); composite(); pushHistory('Reorder Layer');

// Translate one drawable layer by (dx,dy) — no composite/history. Lossless: shapes/text by geometry,
// smart objects by their transform, plain rasters by an integer blit (+mask).
function translateOneLayer(t, dx, dy){
  if(!t || t.locked || t.type==='adjust' || t.type==='group') return;
  const W=State.width,H=State.height;
  if(t.type==='shape' && t.shape){ if(t.shape.kind==='path') mapPathPoints(t.shape,(x,y)=>({x:x+dx,y:y+dy})); else { t.shape.cx+=dx; t.shape.cy+=dy; } renderShapeLayer(t); }
  else if(t.type==='text' && t.text){ if(t.text.onPath) mapTextPath(t.text,(x,y)=>({x:x+dx,y:y+dy})); t.text.x+=dx; t.text.y+=dy; renderTextLayer(t); }
  else if(t.smart && t.soTransform){ t.soTransform.cx+=dx; t.soTransform.cy+=dy; rebuildSmartSource(t); renderSmartFilters(t); }
  else { const snap=makeLayerCanvas(); snap.getContext('2d').drawImage(t.canvas,0,0); t.ctx.clearRect(0,0,W,H); t.ctx.drawImage(snap,dx,dy);
    if(t.mask){ const ms=makeLayerCanvas(); ms.getContext('2d').drawImage(t.mask,0,0); t.maskCtx.clearRect(0,0,W,H); t.maskCtx.drawImage(ms,dx,dy); t._maskAlpha=null; t._maskDirty=true; }
    fxInvalidate(t); }
}
// Translate a layer OR a whole group's subtree by an integer (dx,dy) — no composite/history.
function translateUnit(l, dx, dy){ dx=Math.round(dx); dy=Math.round(dy); if(!dx&&!dy)return;
  const targets = l.type==='group' ? subtreeIds(l.id).map(x=>State.layers.find(y=>y.id===x)).filter(x=>x&&x.type!=='group') : [l];
  for(const t of targets) translateOneLayer(t, dx, dy); }
function offsetLayerById(id, dx, dy){ const l=State.layers.find(x=>x.id===id); if(!l) throw new Error('No such layer: '+id);
  translateUnit(l, +dx||0, +dy||0); composite(); pushHistory('Offset Layer'); }
// Rotate (+rad = clockwise) and/or flip a vector shape's geometry about pivot (px,py) — stays crisp.
function transformShapeGeom(t, px, py, rad, flipH, flipV){ const s=t.shape;
  if(s.kind==='path'){ // flip then rotate every anchor+handle about the pivot
    if(flipH) mapPathPoints(s,(x,y)=>({x:2*px-x, y}));
    if(flipV) mapPathPoints(s,(x,y)=>({x, y:2*py-y}));
    if(rad){ const c=Math.cos(rad), si=Math.sin(rad); mapPathPoints(s,(x,y)=>{ const dx=x-px, dy=y-py; return {x:px+dx*c-dy*si, y:py+dx*si+dy*c}; }); }
    renderShapeLayer(t); return; }
  if(flipH){ s.cx=2*px-s.cx; s.angle=-(s.angle||0); if(s.kind==='line')s.diag=-s.diag; }
  if(flipV){ s.cy=2*py-s.cy; s.angle=-(s.angle||0); if(s.kind==='line')s.diag=-s.diag; }
  if(rad){ const dx=s.cx-px, dy=s.cy-py, c=Math.cos(rad), si=Math.sin(rad); s.cx=px+dx*c-dy*si; s.cy=py+dx*si+dy*c; s.angle=(s.angle||0)+rad; }
  renderShapeLayer(t); }
// Bake a rotate/flip into a layer's pixels about pivot (px,py). Applies flip THEN rotate (matches the
// shape-geometry path). Converts text/smart layers to plain rasters so they don't revert.
function bakeTransform(t, px, py, rad, sx, sy){
  const W=State.width,H=State.height;
  const xform=(ctx,src)=>{ ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H); ctx.save(); ctx.translate(px,py); ctx.rotate(rad); ctx.scale(sx,sy); ctx.translate(-px,-py); ctx.imageSmoothingQuality='high'; ctx.drawImage(src,0,0); ctx.restore(); };
  const snap=document.createElement('canvas'); snap.width=t.canvas.width; snap.height=t.canvas.height; snap.getContext('2d').drawImage(t.canvas,0,0);
  xform(t.ctx, snap);
  if(t.mask){ const ms=document.createElement('canvas'); ms.width=t.mask.width; ms.height=t.mask.height; ms.getContext('2d').drawImage(t.mask,0,0); xform(t.maskCtx, ms); t._maskAlpha=null; t._maskDirty=true; }

  if(t.smart){ t.smart=false; t.smartSource=null; t.smartFilters=null; t.soContent=null; t.soTransform=null; }

// Rotate/flip a layer or a whole group around its OWN centre (bbox centre).
function transformLayerById(id, opts){ opts=opts||{};
  const l=State.layers.find(x=>x.id===id); if(!l) throw new Error('No such layer: '+id);
  const rad=(+opts.rotate||0)*Math.PI/180, flipH=opts.flip==='horizontal', flipV=opts.flip==='vertical';
  if(!rad && !flipH && !flipV) throw new Error('Provide rotate (degrees) and/or flip (horizontal|vertical)');
  const bb=unitBBox(l); if(!bb){ toast('Nothing to transform'); return; }
  const px=bb.x+bb.w/2, py=bb.y+bb.h/2;
  const targets = l.type==='group' ? subtreeIds(l.id).map(x=>State.layers.find(y=>y.id===x)).filter(x=>x&&x.type!=='group'&&x.type!=='adjust') : [l];
  for(const t of targets){ if(t.locked) continue;
    if(t.type==='shape'&&t.shape) transformShapeGeom(t, px, py, rad, flipH, flipV);
    else bakeTransform(t, px, py, rad, flipH?-1:1, flipV?-1:1);
  }

// Tight alpha bounds of a canvas, or null if fully transparent.
function alphaBounds(canvas){ const W=canvas.width,H=canvas.height; const d=canvas.getContext('2d').getImageData(0,0,W,H).data;
  let minx=W,miny=H,maxx=-1,maxy=-1; for(let y=0;y<H;y++)for(let x=0;x<W;x++){ if(d[(y*W+x)*4+3]>4){ if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; } }
  return maxx<0? null : {x:minx,y:miny,w:maxx-minx+1,h:maxy-miny+1}; }
// Visible bounding box of a layer, or a group's union bbox, in doc coords (null if empty).
function unitBBox(l){
  if(l.type==='group'){ let mnx=Infinity,mny=Infinity,mxx=-Infinity,mxy=-Infinity,any=false;
    for(const id of subtreeIds(l.id)){ const d=State.layers.find(y=>y.id===id); if(!d||d.type==='group'||d.type==='adjust')continue; const b=alphaBounds(d.canvas); if(!b)continue; any=true; mnx=Math.min(mnx,b.x); mny=Math.min(mny,b.y); mxx=Math.max(mxx,b.x+b.w); mxy=Math.max(mxy,b.y+b.h); }
    return any? {x:mnx,y:mny,w:mxx-mnx,h:mxy-mny} : null; }
  return alphaBounds(l.canvas);
}
// Align and/or distribute a set of units (layers/groups). align: left|right|hcenter|top|bottom|vcenter;
// distribute: horizontal|vertical (even centers); relativeTo: 'selection'(default) | 'canvas'.
function alignDistribute(units, opts){
  opts=opts||{};
  let items=units.map(l=>({l, b:unitBBox(l)})).filter(it=>it.b);
  if(!items.length){ toast('Nothing with pixels to align'); return; }
  if(opts.align){
    let refL,refR,refT,refB;
    if(opts.relativeTo==='canvas'){ refL=0; refR=State.width; refT=0; refB=State.height; }
    else { refL=Math.min(...items.map(i=>i.b.x)); refR=Math.max(...items.map(i=>i.b.x+i.b.w)); refT=Math.min(...items.map(i=>i.b.y)); refB=Math.max(...items.map(i=>i.b.y+i.b.h)); }
    const refCX=(refL+refR)/2, refCY=(refT+refB)/2;
    for(const it of items){ const b=it.b; let dx=0,dy=0;
      if(opts.align==='left')dx=refL-b.x; else if(opts.align==='right')dx=refR-(b.x+b.w); else if(opts.align==='hcenter')dx=refCX-(b.x+b.w/2);
      else if(opts.align==='top')dy=refT-b.y; else if(opts.align==='bottom')dy=refB-(b.y+b.h); else if(opts.align==='vcenter')dy=refCY-(b.y+b.h/2);
      if(dx||dy){ translateUnit(it.l, dx, dy); it.b=unitBBox(it.l); } }
  }
  if(opts.distribute){
    const horiz=opts.distribute==='horizontal';
    const arr=items.map(it=>({l:it.l, b:unitBBox(it.l)})).filter(it=>it.b)
      .sort((a,c)=> horiz ? (a.b.x+a.b.w/2)-(c.b.x+c.b.w/2) : (a.b.y+a.b.h/2)-(c.b.y+c.b.h/2));
    if(arr.length>=3){ const cen=it=> horiz ? it.b.x+it.b.w/2 : it.b.y+it.b.h/2;
      const c0=cen(arr[0]), cN=cen(arr[arr.length-1]), step=(cN-c0)/(arr.length-1);
      for(let i=1;i<arr.length-1;i++){ const delta=(c0+step*i)-cen(arr[i]); if(horiz)translateUnit(arr[i].l,delta,0); else translateUnit(arr[i].l,0,delta); } }
  }
  composite(); renderLayerList(); pushHistory('Align / Distribute');
}

// Deep-copy a layer object (new id, its own canvas/mask/embedded content). rename appends " copy".
function cloneLayer(l, rename){
  const n=newLayer(rename? (l.name+' copy') : l.name);
  n.visible=l.visible; n.locked=l.locked; n.opacity=l.opacity; n.blend=l.blend; n.type=l.type;
  n.text=cloneText(l.text); n.clipped=l.clipped; n.maskFeather=l.maskFeather; n.maskDensity=l.maskDensity;
  n.styles=l.styles?JSON.parse(JSON.stringify(l.styles)):null; n.adjust=l.adjust?JSON.parse(JSON.stringify(l.adjust)):null;
  n.groupId=l.groupId||null; n.expanded=l.expanded;
  n.ctx.drawImage(l.canvas,0,0);
  n.smart=l.smart; n.smartFilters=l.smartFilters?JSON.parse(JSON.stringify(l.smartFilters)):null;
  if(l.type==='shape'&&l.shape){ n.shape=cloneShape(l.shape); renderShapeLayer(n); }
  if(l.smart&&l.smartSource){ const sc=makeLayerCanvas(); sc.getContext('2d').drawImage(l.smartSource,0,0); n.smartSource=sc; }
  if(l.smart&&l.soContent){ const cc=document.createElement('canvas'); cc.width=l.soContent.width; cc.height=l.soContent.height; cc.getContext('2d').drawImage(l.soContent,0,0); n.soContent=cc; n.soTransform=l.soTransform?{...l.soTransform}:null; }
  if(l.mask){ const m=makeLayerCanvas(); const mctx=m.getContext('2d',{willReadFrequently:true}); mctx.drawImage(l.mask,0,0); n.mask=m;n.maskCtx=mctx;n._maskDirty=true; }
  return n;
}
function duplicateLayer(){ const l=activeLayer(); if(!l)return;
  if(l.type==='group'){ // duplicate the whole folder subtree (nested groups included), fresh ids
    const clones=[];
    (function cloneRec(h,newParent,isRoot){ const nh=cloneLayer(h,isRoot); nh.type='group'; nh.expanded=h.expanded; nh.groupId=newParent;
      for(const k of childrenOf(h.id)){ if(k.type==='group') cloneRec(k,nh.id,false); else { const nk=cloneLayer(k,false); nk.groupId=nh.id; clones.push(nk); } }
      clones.push(nh); })(l, parentIdOf(l), true);
    const newHeader=clones[clones.length-1];
    const [,hi]=blockRange(l); State.layers.splice(hi+1,0,...clones); normalizeLayerOrder();
    State.activeId=newHeader.id; State.selectedIds=[newHeader.id]; State.selAnchor=newHeader.id;
    renderLayerList(); composite(); pushHistory('Duplicate Group'); return;
  }
  const n=cloneLayer(l,true);
  const idx=State.layers.indexOf(l); State.layers.splice(idx+1,0,n); State.activeId=n.id; State.selectedIds=[n.id]; State.selAnchor=n.id;
  renderLayerList(); composite(); pushHistory('Duplicate Layer'); }
function deleteLayer(){ const sel=selectionIds(); const del=new Set(sel);
  for(const id of sel){ const l=State.layers.find(x=>x.id===id); if(l&&l.type==='group') subtreeIds(l.id).forEach(x=>del.add(x)); } // delete a folder's whole subtree
  const ids=[...del];
  if(ids.length>=State.layers.length){ toast('Cannot delete all layers'); return; }
  const firstIdx=Math.min(...ids.map(id=>State.layers.findIndex(l=>l.id===id)));
  ids.forEach(id=>{ const l=State.layers.find(x=>x.id===id); if(l&&l.type==='group') delete _groupTmp[l.id]; });
  State.layers=State.layers.filter(l=>!ids.includes(l.id));
  // prune emptied folders (repeat: removing an inner group can empty its parent)
  let changed=true; while(changed){ changed=false; const empties=State.layers.filter(l=>l.type==='group' && childrenOf(l.id).length===0);
    if(empties.length){ empties.forEach(e=>delete _groupTmp[e.id]); State.layers=State.layers.filter(l=>!empties.includes(l)); changed=true; } }
  const ni=clamp(firstIdx-1,0,State.layers.length-1);
  State.activeId=State.layers[ni]?State.layers[ni].id:null; State.selectedIds=State.activeId?[State.activeId]:[]; State.selAnchor=State.activeId;
  renderLayerList(); composite(); pushHistory(ids.length>1?'Delete Layers':'Delete Layer'); }
function mergeDown(){ const idx=State.layers.findIndex(l=>l.id===State.activeId); if(idx<=0)return; const top=State.layers[idx],bot=State.layers[idx-1];
  let topSrc=top.canvas;
  if(top.mask){ const t=tmpCanvas(); const tc=t.getContext('2d'); tc.globalCompositeOperation='source-over'; tc.clearRect(0,0,State.width,State.height); tc.drawImage(top.canvas,0,0); tc.globalCompositeOperation='destination-in'; tc.drawImage(getMaskAlpha(top),0,0); tc.globalCompositeOperation='source-over'; const keep=document.createElement('canvas'); keep.width=State.width;keep.height=State.height; keep.getContext('2d').drawImage(t,0,0); topSrc=keep; }
  bot.ctx.globalAlpha=top.opacity/100; bot.ctx.globalCompositeOperation=top.blend; bot.ctx.drawImage(topSrc,0,0); bot.ctx.globalAlpha=1;bot.ctx.globalCompositeOperation='source-over'; State.layers.splice(idx,1); State.activeId=bot.id; renderLayerList(); composite(); pushHistory('Merge Down'); }
function flatten(){ const base=newLayer('Background'); base.ctx.drawImage(view,0,0); State.layers=[base]; State.activeId=base.id; renderLayerList(); composite(); pushHistory('Flatten'); }
function toggleClippingFor(l){ if(!l)return; const idx=State.layers.indexOf(l); if(idx<=0){ toast('Select a layer above another — the lower one becomes the clip base'); return; }
  const base=State.layers[idx-1];
  l.clipped=!l.clipped; setActiveLayer(l.id); renderLayerList(); composite(); pushHistory(l.clipped?'Create Clipping Mask':'Release Clipping Mask');
  toast(l.clipped?`Clipped to “${base.name}” below`:'Clipping released'); }
function toggleClipping(){ toggleClippingFor(activeLayer()); }
function layerContextMenu(l){
  const idx=State.layers.indexOf(l); const canClip=idx>0;
  showDialog(`<h3>Layer — ${l.name}</h3><div class="dbody" style="min-width:230px"><div style="display:flex;flex-direction:column;gap:8px">
    <button class="qadj" id="lcClip" ${canClip?'':'disabled style="opacity:.45;cursor:not-allowed"'}>${l.clipped?'Release Clipping Mask':'Create Clipping Mask'}</button>
    ${l.type==='shape'?'<button class="qadj" id="lcShape">Edit Shape (fill / stroke)…</button>':''}
    ${(l.type==='shape'||l.smart)?'<button class="qadj" id="lcRaster">Rasterize Layer</button>':''}
    <button class="qadj" id="lcStyles">Blending Options (Layer Styles)…</button>
    <button class="qadj" id="lcDup">Duplicate Layer</button>
    <button class="qadj" id="lcDel">Delete Layer</button>
  </div><div style="color:var(--text-dim);margin-top:8px;font-size:11px">Tip: Alt-click a layer, or press ⌥⌘G, to clip it to the layer below.</div></div>`, null, 'Close');
  setTimeout(()=>{

    if($('#lcShape')) $('#lcShape').onclick=()=>{hideDialog(); openShapeDialog(l);};
    if($('#lcRaster')) $('#lcRaster').onclick=()=>{hideDialog(); rasterizeLayer(l);};

    $('#lcDup').onclick=()=>{hideDialog(); setActiveLayer(l.id); duplicateLayer();};
