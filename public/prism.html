function sliderRow(label,id,min,max,val,step=1){ return `<div class="row"><label>${label}</label><input type="range" id="${id}" min="${min}" max="${max}" value="${val}" step="${step}"><span class="rangeval" id="${id}V">${val}</span></div>`; }
function livePreview(applyFn){
  // returns {commit, cancel} using a temp snapshot of active layer
  const l=activeLayer(); if(!l) return null;
  const before=l.ctx.getImageData(0,0,State.width,State.height);
  const run=()=>{ l.ctx.putImageData(before,0,0); const img=l.ctx.getImageData(0,0,State.width,State.height);
    const orig=State.selection?new Uint8ClampedArray(img.data):null; applyFn(img); if(State.selection){const d=img.data,m=State.selection.mask;for(let i=0;i<m.length;i++){const a=m[i]/255;if(a<1){const p=i*4;for(let k=0;k<4;k++)d[p+k]=orig[p+k]*(1-a)+d[p+k]*a;}}} l.ctx.putImageData(img,0,0); fxInvalidate(l); composite(); };
  return { run, before, restore:()=>{ l.ctx.putImageData(before,0,0); fxInvalidate(l); composite(); } };
}
function openAdjustment(kind){
  const l=activeLayer(); if(!l){toast('No layer');return;}
  // On an adjustment layer, re-open its own editor.
  if(l.type==='adjust'){ openAdjustmentLayerDialog(l); return; }
  // On a smart object, adjustments join the non-destructive smart stack instead of baking in.
  if(l.smart){ if(kind==='invert'||kind==='desaturate') addSmartOp(l,kind,{}); else openSmartOpDialog(l,kind,null); return; }
  const W=State.width,H=State.height;
  if(kind==='invert'){ applyToActive(img=>Adjust.invert(img),'Invert'); return; }
  if(kind==='desaturate'){ applyToActive(img=>Adjust.desaturate(img),'Desaturate'); return; }
  if(kind==='selectivecolor'){ const params=defaultSelectiveParams(); const lp=livePreview(img=>Adjust.selectiveColor(img,params)); selectiveColorDialog('Selective Color', params, ()=>lp&&lp.run(), ()=>pushHistory('Selective Color'), ()=>lp&&lp.restore()); return; }
  if(kind==='curves'){ const params={curves:{rgb:[{x:0,y:255},{x:255,y:0}]}}; const lp=livePreview(img=>runOp('curves',params,img,State.width,State.height)); curvesDialog('Curves', params, ()=>lp&&lp.run(), ()=>pushHistory('Curves'), ()=>lp&&lp.restore()); return; }
  if(kind==='levels'){ const params={il:0,g:100,ih:255,ol:0,oh:255}; const lp=livePreview(img=>runOp('levels',params,img,State.width,State.height)); levelsDialog('Levels', params, ()=>lp&&lp.run(), ()=>pushHistory('Levels'), ()=>lp&&lp.restore()); return; }

  let bodyHtml='', bind=null, label=kind;
  if(kind==='brightcontrast'){ bodyHtml=sliderRow('Brightness','b',-150,150,0)+sliderRow('Contrast','c',-100,100,0);
    bind=lp=>()=>lp.run(); }
  if(kind==='levels'){ bodyHtml=sliderRow('Input Black','il',0,254,0)+sliderRow('Gamma','g',10,300,100)+sliderRow('Input White','ih',1,255,255)+sliderRow('Output Black','ol',0,255,0)+sliderRow('Output White','oh',0,255,255); }
  if(kind==='curves'){ bodyHtml=`<div class="dbody" style="padding:0"><canvas id="curveCanvas" width="256" height="256" style="width:256px;height:256px"></canvas><div style="color:var(--text-dim);margin-top:6px">Drag to bend the curve. Click to add points.</div></div>`; }
  if(kind==='huesat'){ bodyHtml=sliderRow('Hue','h',-180,180,0)+sliderRow('Saturation','s',-100,100,0)+sliderRow('Lightness','v',-100,100,0); }
  if(kind==='colorbalance'){ bodyHtml=sliderRow('Cyan → Red','r',-100,100,0)+sliderRow('Magenta → Green','g',-100,100,0)+sliderRow('Yellow → Blue','b',-100,100,0); }
  if(kind==='vibrance'){ bodyHtml=sliderRow('Vibrance','v',-100,100,0); }
  if(kind==='exposure'){ bodyHtml=sliderRow('Exposure (EV)','ev',-300,300,0); }
  if(kind==='threshold'){ bodyHtml=sliderRow('Threshold','t',1,255,128); }

let curvePoints=[{x:0,y:255},{x:255,y:0}]; let curveLUT=new Uint8ClampedArray(256);
function computeLUTFromPoints(points){ const lut=new Uint8ClampedArray(256); const pts=[...points].sort((a,b)=>a.x-b.x); for(let i=0;i<256;i++){ let p0=pts[0],p1=pts[pts.length-1]; for(let j=0;j<pts.length-1;j++){ if(i>=pts[j].x&&i<=pts[j+1].x){p0=pts[j];p1=pts[j+1];break;} } const t=(p1.x===p0.x)?0:(i-p0.x)/(p1.x-p0.x); lut[i]=clamp(255-(p0.y+(p1.y-p0.y)*t),0,255); } return lut; }

// onUpdate: called on every edit. initialPoints: optional starting curve (for editing an existing smart curve).
function initCurves(onUpdate, initialPoints){ curvePoints = initialPoints? initialPoints.map(p=>({x:p.x,y:p.y})) : [{x:0,y:255},{x:255,y:0}]; const cv=$('#curveCanvas'); const ctx=cv.getContext('2d'); let drag=null;
  const draw=()=>{ ctx.clearRect(0,0,256,256); ctx.strokeStyle='#333'; for(let i=0;i<=4;i++){ctx.beginPath();ctx.moveTo(i*64,0);ctx.lineTo(i*64,256);ctx.moveTo(0,i*64);ctx.lineTo(256,i*64);ctx.stroke();} computeCurveLUT(); ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath(); for(let i=0;i<256;i++){ const y=255-curveLUT[i]; if(i===0)ctx.moveTo(i,y);else ctx.lineTo(i,y);} ctx.stroke(); ctx.fillStyle='#2d7ff9'; for(const p of curvePoints){ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();} };
  cv.onmousedown=e=>{ const r=cv.getBoundingClientRect(); const x=clamp((e.clientX-r.left),0,255),y=clamp((e.clientY-r.top),0,255); let near=curvePoints.find(p=>Math.hypot(p.x-x,p.y-y)<10); if(!near){near={x,y};curvePoints.push(near);} drag=near; const mv=ev=>{const x=clamp((ev.clientX-r.left),0,255),y=clamp((ev.clientY-r.top),0,255); drag.x=x;drag.y=y; draw(); onUpdate&&onUpdate();}; const up=()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);}; window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up); draw(); onUpdate&&onUpdate(); };

  $$('#dialog input[type=range]').forEach(inp=>inp.oninput=()=>{ const v=$('#'+inp.id+'V'); if(v)v.textContent=inp.value; preview(); });

// Image Size (scales content). Geometry-aware: on UNIFORM scale, vector shapes/text/smart objects scale
// their geometry (stay crisp & editable); rasters resample. Non-uniform scale of rotated shapes / text
// bakes them (can't be represented as box+angle). Masks resample with their layer.
function resizeImage(w,h){ w=clamp(Math.round(w),1,20000); h=clamp(Math.round(h),1,20000);
  const oldW=State.width, oldH=State.height, sx=w/oldW, sy=h/oldH, uniform=Math.abs(sx-sy)<1e-4, savg=(sx+sy)/2;
  for(const l of State.layers){ const tmp=makeLayerCanvas(); tmp.getContext('2d').drawImage(l.canvas,0,0); l.canvas.width=w;l.canvas.height=h; l.ctx.imageSmoothingQuality='high'; l.ctx.drawImage(tmp,0,0,tmp.width,tmp.height,0,0,w,h);
    if(l.mask){ const mt=makeLayerCanvas(); mt.getContext('2d').drawImage(l.mask,0,0); l.mask.width=w;l.mask.height=h; l.maskCtx.imageSmoothingQuality='high'; l.maskCtx.drawImage(mt,0,0,mt.width,mt.height,0,0,w,h); l._maskAlpha=null;l._maskDirty=true; } }
  State.width=w;State.height=h; State.selection=null; resizeCanvases();
  for(const l of State.layers){
    if(l.smart&&l.soTransform){ l.smartSource=makeLayerCanvas(); l.soTransform.cx*=sx; l.soTransform.cy*=sy; l.soTransform.w*=sx; l.soTransform.h*=sy; rebuildSmartSource(l); renderSmartFilters(l); }
    else if(isPath(l)){ const s=l.shape; mapPathPoints(s,(x,y)=>({x:x*sx, y:y*sy})); if(s.strokeW)s.strokeW=Math.max(1,s.strokeW*savg); renderShapeLayer(l); }
    else if(l.type==='shape'&&l.shape && (uniform || !l.shape.angle)){ const s=l.shape; s.cx*=sx; s.cy*=sy; s.w*=sx; s.h*=sy; if(s.radius)s.radius*=Math.min(sx,sy); if(s.strokeW)s.strokeW=Math.max(1,s.strokeW*savg); renderShapeLayer(l); }
    else if(l.type==='text'&&l.text && uniform){ l.text.x*=sx; l.text.y*=sy; l.text.size=Math.max(1,Math.round(l.text.size*savg)); renderTextLayer(l); }
    else if(l.type==='shape'&&l.shape){ l.type='pixel'; l.shape=null; } // rotated + non-uniform → baked from the resampled raster
    else if(l.type==='text'&&l.text){ l.type='pixel'; l.text=null; }   // non-uniform text → baked

// Run fn() with the document temporarily scaled by `scale` (crisp — vectors/text re-render at the higher
// resolution), then fully restore state, history, and view. Used for @2x/@3x export.
function withScaledDoc(scale, fn){
  scale=Math.max(0.05, Math.min(8, +scale||1));
  if(Math.abs(scale-1)<1e-6) return fn();
  const histBackup=State.history, idxBackup=State.histIndex, z=State.zoom, px=State.panX, py=State.panY, af=autoFit;
  const snap=snapshot();
  resizeImage(Math.round(State.width*scale), Math.round(State.height*scale));
  let out; try{ out=fn(); }
  finally{ restore(snap); State.history=histBackup; State.histIndex=idxBackup; State.zoom=z; State.panX=px; State.panY=py; autoFit=af; applyTransform(); }
  return out;
}
function canvasSizeDialog(){

    <div class="row"><label>Anchor</label><select id="csAnchor"><option>center</option><option>top-left</option><option>top-right</option><option>bottom-left</option><option>bottom-right</option></select></div>
  </div>`, ()=>{ resizeCanvas(+$('#csW').value,+$('#csH').value,$('#csAnchor').value); }, 'OK');
}
// Canvas Size (does NOT scale content). Repositions content by an anchor (9-grid) or explicit offset:
// shapes/text move by geometry, smart objects by their transform, rasters/masks by an offset blit —
// so re-rendering never desyncs. Growing adds transparent space; shrinking crops.
function resizeCanvas(w,h,anchorOrOpts){ w=clamp(Math.round(w),1,20000); h=clamp(Math.round(h),1,20000);
  const oldW=State.width, oldH=State.height;
  const opts = (anchorOrOpts && typeof anchorOrOpts==='object') ? anchorOrOpts : {anchor:anchorOrOpts||'center'};
  let ox,oy;
  if(opts.offsetX!=null || opts.offsetY!=null){ ox=Math.round(opts.offsetX||0); oy=Math.round(opts.offsetY||0); }
  else { const a=String(opts.anchor||'center');
    ox = a.includes('left')?0 : a.includes('right')?(w-oldW) : Math.round((w-oldW)/2);
    oy = a.includes('top')?0 : a.includes('bottom')?(h-oldH) : Math.round((h-oldH)/2); }
  const cp=c=>{ if(!c)return null; const n=document.createElement('canvas'); n.width=oldW; n.height=oldH; n.getContext('2d').drawImage(c,0,0); return n; };
  const snaps=State.layers.map(l=>({l, canvas:cp(l.canvas), mask:cp(l.mask)}));
  State.width=w; State.height=h; State.selection=null; resizeCanvases();
  for(const s of snaps){ const l=s.l;
    l.canvas.width=w; l.canvas.height=h;
    if(isPath(l)){ mapPathPoints(l.shape,(x,y)=>({x:x+ox, y:y+oy})); renderShapeLayer(l); }
    else if(l.type==='shape'&&l.shape){ l.shape.cx+=ox; l.shape.cy+=oy; renderShapeLayer(l); }
    else if(l.type==='text'&&l.text){ l.text.x+=ox; l.text.y+=oy; renderTextLayer(l); }
    else if(l.smart&&l.soTransform){ l.smartSource=makeLayerCanvas(); l.soTransform.cx+=ox; l.soTransform.cy+=oy; rebuildSmartSource(l); renderSmartFilters(l); }
    else if(l.type!=='group'&&l.type!=='adjust'){ l.ctx.drawImage(s.canvas, ox, oy); }
    if(l.mask){ l.mask.width=w; l.mask.height=h; l.maskCtx.drawImage(s.mask, ox, oy); l._maskAlpha=null; l._maskDirty=true; }
    fxInvalidate(l);
  }
  renderLayerList(); composite(); fitToScreen(); pushHistory(opts.label||'Canvas Size'); }
function rotate(deg){ const rad=deg*Math.PI/180; const swap=(deg===90||deg===270); const oldW=State.width, oldH=State.height; const nw=swap?oldH:oldW, nh=swap?oldW:oldH;
  const ocx=oldW/2, ocy=oldH/2, ncx=nw/2, ncy=nh/2;
  for(const l of State.layers){ const tmp=makeLayerCanvas(); tmp.getContext('2d').drawImage(l.canvas,0,0); l.canvas.width=nw;l.canvas.height=nh; const c=l.ctx; c.save(); c.translate(ncx,ncy); c.rotate(rad); c.drawImage(tmp,-ocx,-ocy); c.restore();
    if(l.mask){ const mt=makeLayerCanvas(); mt.getContext('2d').drawImage(l.mask,0,0); l.mask.width=nw;l.mask.height=nh; const mc=l.maskCtx; mc.save(); mc.translate(ncx,ncy); mc.rotate(rad); mc.drawImage(mt,-ocx,-ocy); mc.restore(); l._maskAlpha=null;l._maskDirty=true; }

// PatchMatch EM inpainting core. col=Float32 RGB, hole=1 where to fill. initNNF=optional seed
// (per-pixel source index) from a coarser pyramid level. Returns the final NNF.
function patchMatchCore(col, hole, W, H, P, iters, initNNF){
  const N=W*H;
  const II=new Int32Array((W+1)*(H+1));
  for(let y=0;y<H;y++){ let rs=0; for(let x=0;x<W;x++){ rs+=hole[y*W+x]; II[(y+1)*(W+1)+(x+1)]=II[y*(W+1)+(x+1)]+rs; } }
  const patchHoles=(cx,cy)=>{ const x0=cx-P,y0=cy-P,x1=cx+P+1,y1=cy+P+1; if(x0<0||y0<0||x1>W||y1>H)return 1; return II[y1*(W+1)+x1]-II[y0*(W+1)+x1]-II[y1*(W+1)+x0]+II[y0*(W+1)+x0]; };
  const holePix=[]; for(let i=0;i<N;i++) if(hole[i]) holePix.push(i);
  const idNNF=()=>{ const a=new Int32Array(N); for(let i=0;i<N;i++)a[i]=i; return a; };
  if(!holePix.length) return idNNF();
  const srcCenters=[]; for(let y=P;y<H-P;y++)for(let x=P;x<W-P;x++){ if(patchHoles(x,y)===0) srcCenters.push(y*W+x); }
  if(!srcCenters.length){ let r=0,g=0,b=0,c=0; for(let i=0;i<N;i++) if(!hole[i]){r+=col[i*3];g+=col[i*3+1];b+=col[i*3+2];c++;} if(c){r/=c;g/=c;b/=c;} for(const i of holePix){col[i*3]=r;col[i*3+1]=g;col[i*3+2]=b;} return idNNF(); }
  const nnf=new Int32Array(N); for(let i=0;i<N;i++) nnf[i]=i;
  if(initNNF){ // seed from coarser level; validate each hole patch is inside a fully-known region
    for(const i of holePix){ let s=initNNF[i]; let sx=s%W,sy=(s/W)|0; if(sx<P||sy<P||sx>=W-P||sy>=H-P||patchHoles(sx,sy)!==0) s=srcCenters[(Math.random()*srcCenters.length)|0]; nnf[i]=s; }
  } else { for(const i of holePix){ const s=srcCenters[(Math.random()*srcCenters.length)|0]; nnf[i]=s; col[i*3]=col[s*3]; col[i*3+1]=col[s*3+1]; col[i*3+2]=col[s*3+2]; } }
  const dist=(px,py,sx,sy,best)=>{ let d=0; for(let dy=-P;dy<=P;dy++)for(let dx=-P;dx<=P;dx++){ const qx=px+dx,qy=py+dy,tx=sx+dx,ty=sy+dy; if(qx<0||qy<0||qx>=W||qy>=H||tx<0||ty<0||tx>=W||ty>=H){d+=195075;continue;} const qi=(qy*W+qx)*3,ti=(ty*W+tx)*3,r=col[qi]-col[ti],g=col[qi+1]-col[ti+1],b=col[qi+2]-col[ti+2]; d+=r*r+g*g+b*b; if(d>=best)return d; } return d; };
  for(let it=0;it<iters;it++){
    const rev=it&1; const order=rev?holePix.slice().reverse():holePix;
    for(const i of order){ const px=i%W, py=(i/W)|0; let s=nnf[i]; let bsx=s%W,bsy=(s/W)|0; let bd=dist(px,py,bsx,bsy,Infinity);

      for(const ni of neigh){ if(ni<0||ni>=N)continue; const nn=nnf[ni]; let csx=nn%W + (px-(ni%W)), csy=((nn/W)|0)+(py-((ni/W)|0)); if(csx<P||csy<P||csx>=W-P||csy>=H-P)continue; if(patchHoles(csx,csy)!==0)continue; const d=dist(px,py,csx,csy,bd); if(d<bd){bd=d;bsx=csx;bsy=csy;} }
      let rad=Math.max(W,H); while(rad>=1){ const rxs=bsx+((Math.random()*2-1)*rad|0), rys=bsy+((Math.random()*2-1)*rad|0); if(rxs>=P&&rys>=P&&rxs<W-P&&rys<H-P&&patchHoles(rxs,rys)===0){ const d=dist(px,py,rxs,rys,bd); if(d<bd){bd=d;bsx=rxs;bsy=rys;} } rad=(rad/2)|0; }
      nnf[i]=bsy*W+bsx;
    }
    const aR=new Float32Array(N),aG=new Float32Array(N),aB=new Float32Array(N),aW=new Float32Array(N);
    for(const i of holePix){ const px=i%W,py=(i/W)|0,s=nnf[i],sx=s%W,sy=(s/W)|0;
      for(let dy=-P;dy<=P;dy++)for(let dx=-P;dx<=P;dx++){ const qx=px+dx,qy=py+dy; if(qx<0||qy<0||qx>=W||qy>=H)continue; const qi=qy*W+qx; if(!hole[qi])continue; const tx=sx+dx,ty=sy+dy; if(tx<0||ty<0||tx>=W||ty>=H)continue; const ti=(ty*W+tx)*3; aR[qi]+=col[ti];aG[qi]+=col[ti+1];aB[qi]+=col[ti+2];aW[qi]++; } }

// Downsample a level by 2 (box-average colour; majority-vote hole).
function pmBuildLevel(col, hole, W, H){
  const W2=Math.max(1,W>>1), H2=Math.max(1,H>>1); const c2=new Float32Array(W2*H2*3), h2=new Uint8Array(W2*H2);

    for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){ const sx=Math.min(W-1,x*2+dx), sy=Math.min(H-1,y*2+dy); const si=sy*W+sx; r+=col[si*3];g+=col[si*3+1];b+=col[si*3+2]; hc+=hole[si]; n++; }
    const i=y*W2+x; c2[i*3]=r/n; c2[i*3+1]=g/n; c2[i*3+2]=b/n; h2[i]= hc*2>=n?1:0; }

// Multi-resolution (coarse-to-fine) PatchMatch: solve coarsest from scratch, then upsample the
// filled colours + NNF to seed each finer level. Fills col (level-0 array) in place.
function patchMatchInpaint(col, hole, W, H, P){
  const levels=[{col,hole,W,H}];
  while(Math.min(levels[levels.length-1].W, levels[levels.length-1].H) > 30 && levels.length<6){
    const prev=levels[levels.length-1]; levels.push(pmBuildLevel(prev.col,prev.hole,prev.W,prev.H));
  }
  let prev=levels[levels.length-1];
  let nnf=patchMatchCore(prev.col, prev.hole, prev.W, prev.H, P, 10, null);
  for(let li=levels.length-2; li>=0; li--){
    const lv=levels[li];
    const initNNF=new Int32Array(lv.W*lv.H);
    for(let y=0;y<lv.H;y++)for(let x=0;x<lv.W;x++){ const i=y*lv.W+x;
      if(lv.hole[i]){ const px=Math.min(prev.W-1,x>>1), py=Math.min(prev.H-1,y>>1); const pi=py*prev.W+px;
        // seed colour from the upsampled coarse fill
        lv.col[i*3]=prev.col[pi*3]; lv.col[i*3+1]=prev.col[pi*3+1]; lv.col[i*3+2]=prev.col[pi*3+2];
        // seed NNF: parent source ×2 keeping intra-cell offset
        const ps=nnf[pi]; let psx=(ps%prev.W)*2+(x&1), psy=((ps/prev.W)|0)*2+(y&1);
        psx=Math.min(lv.W-1-P,Math.max(P,psx)); psy=Math.min(lv.H-1-P,Math.max(P,psy)); initNNF[i]=psy*lv.W+psx;
      } else initNNF[i]=i;
    }
    nnf=patchMatchCore(lv.col, lv.hole, lv.W, lv.H, P, li===0?6:5, initNNF);
    prev=lv;
  }
}
// PatchMatch-fill a hole (Uint8 W*H, 1=fill) within bounds b, pasting into l with a feathered edge.

//---- PSD PARSER (best-effort: composite + layers, RAW/RLE) ----
function parsePSD(buffer,name){

    const mode=dv.getUint16(o); o+=2;
    // Color Mode Data
    const cmLen=dv.getUint32(o); o+=4+cmLen;

        const opacity=dv.getUint8(o); o+=1; const clipping=dv.getUint8(o); o+=1; const flags=dv.getUint8(o); o+=1; o+=1;

function exportAs(type){
  const mime = type==='jpg'?'image/jpeg':type==='webp'?'image/webp':'image/png';
  const q = type==='jpg'?0.92:undefined;
  // flatten to a temp canvas (white bg for jpg)
  const c=document.createElement('canvas');c.width=State.width;c.height=State.height; const ctx=c.getContext('2d');
  if(type==='jpg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);}
  ctx.drawImage(view,0,0);
  c.toBlob(blob=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(State.fileName.replace(/\.[^.]+$/,'')||'prism')+'.'+type; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }, mime, q);
}

window.addEventListener('keydown',e=>{
  if($('#modalScrim').classList.contains('open')){ if(e.key==='Escape'){const f=dialogCancel;hideDialog();if(f)f();} if(e.key==='Enter'){$('#dOK')?.click();} return; }
  if(xf&&xf.active){ if(e.key==='Enter'){e.preventDefault();commitTransform();return;} if(e.key==='Escape'){e.preventDefault();cancelTransform();return;} }
  if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ if(pen)finishPen(); const p=isPath(activeLayer())?activeLayer():State.layers.slice().reverse().find(isPath); if(p){ e.preventDefault(); try{ pathToSelection(p,'replace'); pushHistory('Path to Selection'); toast('Selection made from path'); }catch(err){ toast(err.message); } } return; }
  if(pen){ if(e.key==='Enter'){e.preventDefault();finishPen();return;} if(e.key==='Escape'){e.preventDefault();cancelPen();return;} }
  if(lq&&lq.active){ if(e.key==='Enter'){e.preventDefault();commitLiquify();return;} if(e.key==='Escape'){e.preventDefault();cancelLiquify();return;}
    if(e.key==='['){lq.size=Math.max(10,lq.size-10);renderOptionsBar();return;} if(e.key===']'){lq.size=Math.min(600,lq.size+10);renderOptionsBar();return;} }
  const tag=document.activeElement.tagName; if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  const meta=e.metaKey||e.ctrlKey;
  if(meta){
    const k=e.key.toLowerCase();
    if(k==='z'){e.preventDefault(); e.shiftKey?redo():undo(); return;}
    if(k==='y'){e.preventDefault();redo();return;}
    if(k==='n'&&!e.shiftKey){e.preventDefault();newDialog();return;}
    if(k==='n'&&e.shiftKey){e.preventDefault();addLayer(newLayer('Layer '+State.layers.length));pushHistory('New Layer');return;}
    if(k==='o'){e.preventDefault();openFilePicker();return;}
    if(k==='s'){e.preventDefault(); if(e.shiftKey)exportAs('png'); else if(State.soEdit)updateSmartFromEdit(); else saveProject(); return;}
    if(k==='a'){e.preventDefault();selectAll();pushHistory('Select All');return;}
    if(k==='d'){e.preventDefault();clearSelection();return;}
    if(k==='i'&&e.shiftKey){e.preventDefault();invertSelection();return;}
    if(k==='i'&&e.altKey){e.preventDefault();imageSizeDialog();return;}
    if(k==='i'){e.preventDefault();openAdjustment('invert');return;}
    if(k==='c'){e.preventDefault();e.shiftKey?copyMerged():copySel();return;}
    if(k==='v'){e.preventDefault();paste();return;}
    if(k==='x'&&e.shiftKey){e.preventDefault();enterLiquify();return;}
    if(k==='x'){e.preventDefault();copySel();deleteSelection();return;}
    if(k==='j'){e.preventDefault();duplicateLayer();return;}
    if(k==='g'&&e.altKey){e.preventDefault();toggleClipping();return;}
    if(k==='g'&&e.shiftKey){e.preventDefault();ungroupSelected();return;}
    if(k==='g'){e.preventDefault();groupSelected();return;}
    if(k==='e'){e.preventDefault();mergeDown();return;}
    if(k==='t'){e.preventDefault();enterFreeTransform();return;}
    if(k==='l'){e.preventDefault();openAdjustment('levels');return;}
    if(k==='m'){e.preventDefault();openAdjustment('curves');return;}
    if(k==='u'){e.preventDefault();e.shiftKey?openAdjustment('desaturate'):openAdjustment('huesat');return;}
    if(k==='0'){e.preventDefault();fitToScreen();return;}
    if(k==='1'){e.preventDefault();setZoom(1);return;}
    if(e.key==='='||e.key==='+'){e.preventDefault();setZoom(State.zoom*1.4);return;}
    if(e.key==='-'){e.preventDefault();setZoom(State.zoom/1.4);return;}
    return;
  }
  // single-key tools
  const map={v:'move',m:'marquee',l:'lasso',w:'wand',c:'crop',i:'eyedropper',j:'spotheal',b:'brush',e:'eraser',g:'bucket',s:'clone',t:'text',u:'shape-rect',h:'hand',z:'zoom',o:'dodge'};
  const k=e.key.toLowerCase();
  if(map[k]){ selectTool(map[k]); return; }
  if(e.key==='['){ Opt.brushSize=Math.max(1,Opt.brushSize-3); renderOptionsBar(); return; }
  if(e.key===']'){ Opt.brushSize=Math.min(400,Opt.brushSize+3); renderOptionsBar(); return; }
  if(k==='x'){ const t=State.fg; setFg(State.bg); State.bg=t; $('#bgWell').style.background=rgbToHex(State.bg); return; }
  if(k==='d'){ setFg({r:0,g:0,b:0}); State.bg={r:255,g:255,b:255}; $('#bgWell').style.background='#fff'; return; }
  if(e.key==='Delete'||e.key==='Backspace'){ deleteSelection(); return; }
  if(e.key==='Escape'){ clearSelection(); return; }
  if(e.key===' '){ pointer.spaceDrag=true; stage.style.cursor='grab'; }
});

  // never become undefined (→ NaN → black). Covers numeric params and color params.
  function withDefaults(kind, params){ const s=opSpec(kind), o={}; if(s&&s.params) for(const p of s.params) o[p.id]=p.def; if(s&&s.colors) for(const c of s.colors) o[c.id]=c.def; return Object.assign(o, params||{}); }

    listFilters(){ return Object.keys(FILTERS).map(k=>({id:k,name:FILTERS[k].name,params:(FILTERS[k].params||[]).map(p=>({id:p.id,label:p.label,min:p.min,max:p.max,def:p.def}))})); },
    listAdjustments(){ return Object.keys(ADJREG).map(k=>({id:k,name:ADJREG[k].name,params:(ADJREG[k].params||[]).map(p=>({id:p.id,label:p.label,min:p.min,max:p.max,def:p.def}))})); },
    newDocument(w,h,bg){ newDocument(clampInt(w,800),clampInt(h,600),bg||'white'); return info(); },

      const l=newLayer(o.name||'Rectangle',{type:'shape'}); l.shape={kind:'rect',cx:x+w/2,cy:y+h/2,w,h,angle:0,fill:o.fill===undefined?'#2d7ff9':o.fill,stroke:o.stroke||null,strokeW:clampInt(o.strokeWidth,0),radius:clampInt(o.radius,0),diag:1};
      renderShapeLayer(l); addLayer(l); pushHistory('Shape'); return {id:l.id, ...info()}; },
    addEllipse(o){ o=o||{}; const w=clampInt(o.w,100),h=clampInt(o.h,80),x=clampInt(o.x,0),y=clampInt(o.y,0);
      const l=newLayer(o.name||'Ellipse',{type:'shape'}); l.shape={kind:'ellipse',cx:x+w/2,cy:y+h/2,w,h,angle:0,fill:o.fill===undefined?'#2d7ff9':o.fill,stroke:o.stroke||null,strokeW:clampInt(o.strokeWidth,0),radius:0,diag:1};
      renderShapeLayer(l); addLayer(l); pushHistory('Shape'); return {id:l.id, ...info()}; },
    addLine(o){ o=o||{}; const x1=clampInt(o.x1,0),y1=clampInt(o.y1,0),x2=clampInt(o.x2,100),y2=clampInt(o.y2,100);
      const l=newLayer(o.name||'Line',{type:'shape'}); l.shape={kind:'line',cx:(x1+x2)/2,cy:(y1+y2)/2,w:Math.abs(x2-x1),h:Math.abs(y2-y1),angle:0,fill:null,stroke:o.color||'#000000',strokeW:clampInt(o.width,3),radius:0,diag:(x2-x1)*(y2-y1)>=0?1:-1};
      if(o.cap)l.shape.cap=o.cap; if(o.dash&&o.dash.length)l.shape.dash=o.dash.map(Number); if(o.arrowStart&&o.arrowStart!=='none')l.shape.arrowStart=o.arrowStart; if(o.arrowEnd&&o.arrowEnd!=='none')l.shape.arrowEnd=o.arrowEnd; if(o.arrowSize!=null)l.shape.arrowSize=+o.arrowSize; if(o.varWidth!==undefined)l.shape.varWidth=resolveWidthProfile(o.varWidth);
      renderShapeLayer(l); addLayer(l); pushHistory('Shape'); return {id:l.id, ...info()}; },
    addPath(o){ o=o||{}; const raw=o.points;
      if(!Array.isArray(raw) || raw.length<2) throw new Error('points must be an array of ≥2 anchors ([x,y] pairs or {x,y,hIn,hOut} objects)');
      const normH=h=>{ if(!h)return null; return Array.isArray(h)?{x:+h[0],y:+h[1]}:{x:+h.x,y:+h.y}; };
      const parse=arr=>arr.map(p=> Array.isArray(p) ? {x:+p[0],y:+p[1],hIn:null,hOut:null} : {x:+p.x,y:+p.y,hIn:normH(p.hIn),hOut:normH(p.hOut)});
      const pts=parse(raw);
      let subs=null; if(Array.isArray(o.holes)&&o.holes.length) subs=o.holes.filter(h=>Array.isArray(h)&&h.length>=2).map(parse);
      const closed = !!o.closed || !!(subs&&subs.length); // holes require a filled (closed) region
      if(o.smooth){ if(pts.every(p=>!p.hIn&&!p.hOut)) autoSmoothPath(pts, closed); if(subs) subs.forEach(sp=>{ if(sp.every(p=>!p.hIn&&!p.hOut)) autoSmoothPath(sp,true); }); }
      const l=newLayer(o.name||(subs?'Compound path':'Path'), {type:'shape'});
      l.shape={ kind:'path', pts, closed,
        fill: (o.fill===undefined ? (closed?'#2d7ff9':null) : o.fill),
        stroke: (o.stroke===undefined ? (closed?null:'#000000') : o.stroke),
        strokeW: clampInt(o.strokeWidth, closed?0:2) };
      if(subs) l.shape.subs=subs;
      if(o.cap) l.shape.cap=o.cap; if(o.join) l.shape.join=o.join;
      if(Array.isArray(o.dash)&&o.dash.length) l.shape.dash=o.dash.map(Number).filter(n=>n>=0); if(o.dashOffset!=null) l.shape.dashOffset=+o.dashOffset;
      if(o.arrowStart&&o.arrowStart!=='none') l.shape.arrowStart=o.arrowStart; if(o.arrowEnd&&o.arrowEnd!=='none') l.shape.arrowEnd=o.arrowEnd; if(o.arrowSize!=null) l.shape.arrowSize=+o.arrowSize;
      if(o.varWidth!==undefined) l.shape.varWidth=resolveWidthProfile(o.varWidth);
      renderShapeLayer(l); addLayer(l); pushHistory('Pen Path'); return { id:l.id, points:pts.length, holes:subs?subs.length:0, closed, ...info() }; },
    pathToSelection(id, mode){ const l=id?State.layers.find(x=>x.id===id):null; const r=pathToSelection(l, mode||'replace'); pushHistory('Path to Selection'); return { ...r, ...info() }; },
    selectionToPath(smooth, tolerance){ const r=selectionToPath(!!smooth, tolerance); return { ...r, ...info() }; },
    combinePaths(ids, op, smooth, tolerance){ if(!Array.isArray(ids)||ids.length<2) throw new Error('ids must list ≥2 path layers'); const r=combinePaths(ids, op||'union', {smooth:!!smooth, tolerance}); return { ...r, ...info() }; },
    makeCompoundPath(ids){ if(!Array.isArray(ids)||ids.length<2) throw new Error('ids must list ≥2 path layers'); const r=makeCompoundPath(ids); return { ...r, ...info() }; },
    releaseCompoundPath(id){ const r=releaseCompoundPath(id); return { ...r, ...info() }; },
    setStroke(id, o){ o=o||{}; const l=id?State.layers.find(x=>x.id===id):activeLayer(); if(!l||l.type!=='shape'||!l.shape) throw new Error('Not a shape/path layer'); const s=l.shape;
      if(o.color!==undefined) s.stroke=o.color; if(o.width!=null) s.strokeW=Math.max(0,+o.width);
      if(o.cap){ if(!['butt','round','square'].includes(o.cap)) throw new Error("cap must be butt|round|square"); s.cap=o.cap; }
      if(o.join){ if(!['miter','round','bevel'].includes(o.join)) throw new Error("join must be miter|round|bevel"); s.join=o.join; }
      if(o.dash!==undefined) s.dash = (Array.isArray(o.dash)&&o.dash.length) ? o.dash.map(Number).filter(n=>n>=0) : null;
      if(o.dashOffset!=null) s.dashOffset=+o.dashOffset;
      const arr=v=>{ if(v===null||v==='none')return null; if(!ARROW_STYLES.includes(v)) throw new Error('arrow must be one of '+ARROW_STYLES.join('|')+'|none'); return v; };
      if(o.arrowStart!==undefined) s.arrowStart=arr(o.arrowStart); if(o.arrowEnd!==undefined) s.arrowEnd=arr(o.arrowEnd);
      if(o.arrowSize!=null) s.arrowSize=Math.max(0.2,+o.arrowSize);
      if(o.varWidth!==undefined) s.varWidth=resolveWidthProfile(o.varWidth); // array of {at,w} or a preset name; null/'uniform' clears
      renderShapeLayer(l); composite(); renderLayerList(); pushHistory('Stroke Options');
      return { ok:true, stroke:{color:s.stroke, width:s.strokeW, cap:s.cap||'round', join:s.join||'round', dash:s.dash||null, dashOffset:s.dashOffset||0, arrowStart:s.arrowStart||null, arrowEnd:s.arrowEnd||null} }; },
    addText(o){ o=o||{}; const l=newLayer(o.name||('T '+String(o.text||'Text').slice(0,12)),{type:'text'});
      l.text={val:String(o.text==null?'Text':o.text),font:o.font||'Arial',size:clampInt(o.size,48),color:o.color||'#000000',x:clampInt(o.x,40),y:clampInt(o.y,40),bold:!!o.bold,italic:!!o.italic,align:o.align||'left'};
      renderTextLayer(l); addLayer(l); pushHistory('Type'); return {id:l.id, ...info()}; },
    addTextOnPath(o){ o=o||{}; let pathId=o.pathId;
      if(pathId){ if(!isPath(State.layers.find(x=>x.id===pathId))) throw new Error('pathId is not a path layer'); }
      else { if(!Array.isArray(o.points) || o.points.length<2) throw new Error('Provide points (array of anchors) or pathId (an existing path layer)');
        const normH=h=>h?(Array.isArray(h)?{x:+h[0],y:+h[1]}:{x:+h.x,y:+h.y}):null;
        const pts=o.points.map(p=>Array.isArray(p)?{x:+p[0],y:+p[1],hIn:null,hOut:null}:{x:+p.x,y:+p.y,hIn:normH(p.hIn),hOut:normH(p.hOut)}); const closed=!!o.closed;
        if(o.smooth && pts.every(p=>!p.hIn&&!p.hOut)) autoSmoothPath(pts, closed);
        const pl=newLayer('(text path)', {type:'shape'}); pl.shape={kind:'path', pts, closed, fill:null, stroke:null, strokeW:0}; renderShapeLayer(pl); addLayer(pl); pathId=pl.id; } // invisible, editable source path
      const cs=cloneShape(State.layers.find(x=>x.id===pathId).shape);
      const l=newLayer(o.name||('↝ '+String(o.text||'Text').slice(0,12)), {type:'text'});
      l.text={ val:String(o.text==null?'Text':o.text), font:o.font||'Arial', size:clampInt(o.size,48), color:o.color||'#000000',
        x:cs.pts[0].x, y:cs.pts[0].y, bold:!!o.bold, italic:!!o.italic, align:o.align||'left',
        onPath:{pts:cs.pts, closed:!!cs.closed}, pathId, pathOffset:+o.offset||0, tracking:+o.tracking||0, baselineShift:+o.baselineShift||0 };
      renderTextLayer(l); addLayer(l); pushHistory('Text on Path'); return { id:l.id, chars:l.text.val.length, pathId, linked:true, ...info() }; },
    textToPath(textId, pathId){ const tl=textId?State.layers.find(x=>x.id===textId):activeLayer(); if(!tl||tl.type!=='text'||!tl.text) throw new Error('First select/pass a text layer id'); const pl=State.layers.find(x=>x.id===pathId); if(!isPath(pl)) throw new Error('pathId is not a path layer'); const cs=cloneShape(pl.shape); tl.text.pathId=pathId; tl.text.onPath={pts:cs.pts, closed:!!cs.closed}; renderTextLayer(tl); composite(); pushHistory('Text on Path'); return {ok:true, id:tl.id, linked:true}; },
    releaseTextFromPath(id){ const tl=id?State.layers.find(x=>x.id===id):activeLayer(); if(!tl||tl.type!=='text'||!tl.text||!(tl.text.onPath||tl.text.pathId)) throw new Error('Not a text-on-path layer'); const cur=getTextPath(tl.text); if(cur&&cur.pts&&cur.pts[0]){ tl.text.x=cur.pts[0].x; tl.text.y=cur.pts[0].y; } delete tl.text.onPath; delete tl.text.pathId; renderTextLayer(tl); composite(); pushHistory('Release Text from Path'); return {ok:true, id:tl.id}; },
    applyFilter(kind,params){ if(!FILTERS[kind]) throw new Error('Unknown filter: '+kind); applyToActive((img,W,H)=>runOp(kind,withDefaults(kind,params),img,W,H), FILTERS[kind].name); return {ok:true, applied:FILTERS[kind].name}; },
    applyAdjustment(kind,params){ if(!ADJREG[kind]) throw new Error('Unknown adjustment: '+kind); applyToActive((img,W,H)=>runOp(kind,withDefaults(kind,params),img,W,H), ADJREG[kind].name); return {ok:true, applied:ADJREG[kind].name}; },
    selectLayer(id){ if(!State.layers.some(l=>l.id===id)) throw new Error('No such layer: '+id); setActiveLayer(id); return {ok:true, activeId:State.activeId}; },
    setLayerProps(id,p){ p=p||{}; const l=(id&&State.layers.find(x=>x.id===id))||activeLayer(); if(!l) throw new Error('No layer'); if(p.opacity!=null)l.opacity=clamp(+p.opacity,0,100); if(p.blend)l.blend=p.blend; if(p.visible!=null)l.visible=!!p.visible; if(p.name)l.name=p.name; fxInvalidate(l); renderLayerList(); composite(); pushHistory('Layer Props'); return {ok:true}; },
    deleteLayer(id){ if(id) setActiveLayer(id); if(State.layers.length<=1) throw new Error('Cannot delete the last layer'); deleteLayer(); return info(); },
    clipToBelow(id){ toggleClippingFor((id&&State.layers.find(x=>x.id===id))||activeLayer()); return {ok:true}; },
    // --- Smart objects (non-destructive) ---
    toSmartObject(id){ const l=pick(id); if(l.smart) return {ok:true, already:true, id:l.id}; setActiveLayer(l.id); convertToSmartObject(l); return {ok:true, id:l.id, ...info()}; },
    addSmartFilter(kind,params,id){ const l=pick(id); if(!l.smart) throw new Error('Layer is not a smart object — call toSmartObject first'); if(!FILTERS[kind]&&!ADJREG[kind]) throw new Error('Unknown op: '+kind); addSmartOp(l,kind,withDefaults(kind,params)); const f=l.smartFilters[l.smartFilters.length-1]; return {ok:true, filterId:f.id, applied:opName(kind), stack:smartStack(l)}; },
    listSmartFilters(id){ return smartStack(pick(id)); },
    setSmartFilterEnabled(filterId,enabled,id){ const l=pick(id); const f=(l.smartFilters||[]).find(x=>x.id===filterId); if(!f) throw new Error('No such smart filter: '+filterId); f.enabled=!!enabled; renderSmartFilters(l); composite(); renderLayerList(); pushHistory('Toggle Smart Filter'); return {stack:smartStack(l)}; },
    updateSmartFilter(filterId,params,id){ const l=pick(id); const f=(l.smartFilters||[]).find(x=>x.id===filterId); if(!f) throw new Error('No such smart filter: '+filterId); Object.assign(f.params,params||{}); renderSmartFilters(l); composite(); renderLayerList(); pushHistory('Edit Smart Filter'); return {stack:smartStack(l)}; },
    removeSmartFilter(filterId,id){ const l=pick(id); const f=(l.smartFilters||[]).find(x=>x.id===filterId); if(!f) throw new Error('No such smart filter: '+filterId); deleteSmartFilter(l,f); return {stack:smartStack(l)}; },
    reorderSmartFilter(filterId,dir,id){ const l=pick(id); const f=(l.smartFilters||[]).find(x=>x.id===filterId); if(!f) throw new Error('No such smart filter: '+filterId); moveSmartFilter(l,f,dir>0?1:-1); return {stack:smartStack(l)}; },
    resetSmartTransform(id){ const l=pick(id); if(!l.smart) throw new Error('Not a smart object'); setActiveLayer(l.id); resetSmartTransform(l); return {ok:true}; },
    rasterize(id){ const l=pick(id); setActiveLayer(l.id); rasterizeLayer(l); return info(); },
    // --- Layer styles (non-destructive fx) ---
    listLayerStyleTypes(){ const d=defaultStyles(); return Object.keys(d).map(k=>({effect:k, params:Object.keys(d[k]).filter(x=>x!=='enabled'), defaults:d[k]})); },
    setLayerStyle(effect,params,id){ const l=pick(id); if(!l.styles)l.styles=defaultStyles(); if(!l.styles[effect]) throw new Error('Unknown layer style: '+effect+' (see listLayerStyleTypes)'); Object.assign(l.styles[effect], params||{}); if(!params||params.enabled===undefined) l.styles[effect].enabled=true; l._fxDirty=true; renderLayerList(); composite(); pushHistory('Layer Style'); return {ok:true, effect, style:l.styles[effect]}; },
    getLayerStyles(id){ return pick(id).styles||null; },
    clearLayerStyles(id){ const l=pick(id); l.styles=null; l._fxDirty=true; renderLayerList(); composite(); pushHistory('Clear Layer Style'); return {ok:true}; },
    // --- Groups (folders) ---
    groupLayers(ids, name){
      if(Array.isArray(ids) && ids.length){
        const valid=ids.filter(id=>State.layers.some(l=>l.id===id)); // any existing layer, incl. folders → nesting
        if(!valid.length) throw new Error('No matching layer ids');
        State.selectedIds=valid; State.activeId=valid[valid.length-1]; State.selAnchor=State.activeId;
      }
      groupSelected();
      const hdr=activeLayer();
      if(!hdr || hdr.type!=='group') throw new Error('Nothing to group (select ≥1 layer or folder)');
      if(name){ hdr.name=String(name); renderLayerList(); }
      return { ok:true, groupId:hdr.id, name:hdr.name, members:groupMembers(hdr.id).map(m=>({id:m.id,name:m.name})), ...info() };
    },
    ungroupLayers(id){ if(id) setActiveLayer(id); ungroupSelected(); return info(); },
    moveLayer(id, direction, toIndex){ if(!id) throw new Error('id required'); moveLayerById(id, {direction, toIndex}); return info(); },
    offsetLayer(id, dx, dy){ if(!id) throw new Error('id required'); offsetLayerById(id, dx, dy); return { ok:true, id, dx:Math.round(+dx||0), dy:Math.round(+dy||0) }; },
    resizeCanvas(width, height, anchor, offsetX, offsetY){
      if(width==null||height==null) throw new Error('width and height required');
      const opts = (offsetX!=null||offsetY!=null) ? {offsetX, offsetY} : {anchor:anchor||'center'};
      resizeCanvas(+width, +height, opts); // global (geometry-aware)
      return info();
    },
    transformLayer(id, rotate, flip){
      if(!id) throw new Error('id required');
      if(flip && flip!=='horizontal' && flip!=='vertical') throw new Error("flip must be 'horizontal' or 'vertical'");

      return info();

    imageSize(width, height, scale){
      const ow=State.width, oh=State.height, ar=ow/oh; let w, h;
      if(scale!=null){ const f=(+scale)/100; if(!(f>0)) throw new Error('scale must be a positive percentage (100 = same size)'); w=Math.round(ow*f); h=Math.round(oh*f); }
      else if(width!=null && height!=null){ w=Math.round(+width); h=Math.round(+height); }
      else if(width!=null){ w=Math.round(+width); h=Math.round(w/ar); }
      else if(height!=null){ h=Math.round(+height); w=Math.round(h*ar); }
      else throw new Error('Provide scale (percent), or width and/or height');
      resizeImage(w, h); // global (geometry-aware)
      return info();
    },
    cropToContent(padding){
      const p=Math.max(0, Math.round(+padding||0));
      composite(); const b=alphaBounds(view);
      if(!b) throw new Error('Canvas is empty — nothing to crop to');
      if(p===0 && b.x===0 && b.y===0 && b.w===State.width && b.h===State.height) return { ok:true, unchanged:true, ...info() };
      resizeCanvas(b.w+p*2, b.h+p*2, {offsetX:-b.x+p, offsetY:-b.y+p, label:'Crop to Content'}); // global
      return { ok:true, croppedFrom:{x:b.x,y:b.y,w:b.w,h:b.h}, padding:p, ...info() };
    },
    alignLayers(ids, align, distribute, relativeTo){
      const ALIGN=['left','right','hcenter','top','bottom','vcenter'], DIST=['horizontal','vertical'];
      if(align && !ALIGN.includes(align)) throw new Error('align must be one of '+ALIGN.join('|'));
      if(distribute && !DIST.includes(distribute)) throw new Error('distribute must be one of '+DIST.join('|'));
      if(!align && !distribute) throw new Error('Provide align and/or distribute');
      let units = (Array.isArray(ids)&&ids.length) ? ids.map(id=>State.layers.find(l=>l.id===id)).filter(Boolean) : selectedLayers();
      units = units.filter(l=>l.type!=='adjust');
      if(!units.length) throw new Error('Select ≥1 layer/group, or pass ids');
      alignDistribute(units, {align, distribute, relativeTo:relativeTo||'selection'});
      return info();
    },
    duplicateLayer(id){ const src=id? State.layers.find(l=>l.id===id) : activeLayer(); if(!src) throw new Error('No such layer'+(id?': '+id:'')); setActiveLayer(src.id); duplicateLayer(); const n=activeLayer(); return { ok:true, id:n.id, name:n.name, ...(n.type==='group'?{members:groupMembers(n.id).map(m=>({id:m.id,name:m.name}))}:{}), ...info() }; },
    flatten(){ flatten(); return info(); },
    undo(){ undo(); return info(); },
    redo(){ redo(); return info(); },
    exportSlices(ids, crop, scale){
      return withScaledDoc(scale, ()=>{
        const groups = (Array.isArray(ids)&&ids.length)
          ? ids.map(id=>State.layers.find(l=>l.id===id)).filter(l=>l&&l.type==='group')
          : childrenOf(null).filter(l=>l.type==='group'); // default: every top-level folder
        if(!groups.length) throw new Error((ids&&ids.length)? 'No matching group ids' : 'No groups to export — create folders first');
        return groups.map(g=>exportGroupSlice(g.id, crop!==false));
      });
    },
    exportPNG(scale){ return withScaledDoc(scale, ()=>{ composite(); return view.toDataURL('image/png'); }); },
    exportJPEG(q){ composite(); return view.toDataURL('image/jpeg', q==null?0.92:q); }
  };
})();

function init(){
  buildMenus(); renderToolbar(); renderOptionsBar(); renderSwatches();
  setFg({r:0,g:0,b:0}); updateColorPanel();
  newDocument(800,600,'white'); renderTabs();
  window.addEventListener('resize',()=>{ if(autoFit)fitToScreen(); else applyTransform(); });
  // Refit whenever the stage changes size (handles late layout in embeds/previews)
  new ResizeObserver(()=>{ if(autoFit)fitToScreen(); }).observe(stage);
  requestAnimationFrame(()=>requestAnimationFrame(fitToScreen));
  toast('Prism ready — File ▸ Open to load an image');
}
init();
</script>
